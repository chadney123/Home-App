<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <title>Family Hub Pro V28</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #000; --card: #141414; --text: #fff; --dim: #888; --accent: #3498db;
            --Michelle: #e74c3c; --Paul: #3498db; --Ella: #2ecc71; --Ivy: #f1c40f;
            --Family: #9b59b6; --nav-bg: #050505;
        }
        body.light-mode { --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --dim: #86868b; --nav-bg: #ffffff; }

        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; transition: background 0.5s; }
        
        /* AUTO-RATIO GRID SYSTEM */
        .home-grid { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; flex: 1; overflow-y: auto; align-content: start;
        }
        
        /* Mobile "Stacking" Logic */
        @media (max-width: 600px) {
            .home-grid { grid-template-columns: 1fr; }
            .header-tile { flex-direction: column; align-items: center !important; text-align: center; }
            .weather-container { align-items: center !important; text-align: center !important; margin-top: 10px; }
            .home-calendar-strip { grid-template-columns: 1fr 1fr !important; }
            .clock-tile h1 { font-size: 4rem !important; }
        }

        .header-tile { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: flex-start; }
        .clock-tile h1 { font-size: clamp(4rem, 10vw, 6.5rem); margin: 0; font-weight: 700; letter-spacing: -3px; line-height: 0.85; }
        
        .tile { background: var(--card); border-radius: 20px; padding: 15px; border: 1px solid rgba(128,128,128,0.1); display: flex; flex-direction: column; }
        .tile h3 { margin: 0 0 5px 0; font-size: 0.75rem; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }

        .home-calendar-strip { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .person-day { background: var(--card); border-radius: 15px; padding: 10px; border-top: 5px solid var(--c); min-height: 100px; }
        .person-day h4 { margin: 0 0 5px 0; font-size: 0.9rem; font-weight: 700; }
        .mini-event { background: var(--c); color: #fff; font-size: 0.85rem; padding: 6px; border-radius: 8px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* CALENDAR MONTH STYLES */
        .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 10px; flex: 1; overflow-y: auto; }
        .day-col { background: var(--card); border-radius: 8px; border: 1px solid rgba(128,128,128,0.1); display: flex; flex-direction: column; min-height: 100px; position: relative; }
        .day-header { text-align: center; padding: 4px; font-size: 0.8rem; border-bottom: 1px solid rgba(128,128,128,0.05); }
        .cal-event { background: var(--c); color: #fff; padding: 3px 5px; border-radius: 4px; font-size: 0.65rem; margin: 2px; font-weight: 600; line-height: 1.1; overflow: hidden; position: relative; }
        .delete-btn { position: absolute; right: 2px; top: 0; font-size: 8px; color: rgba(255,255,255,0.6); }

        /* NAVIGATION & TABS */
        .tab-content { flex: 1; display: none; overflow: hidden; padding-bottom: 90px; height: 100%; width: 100%; flex-direction: column; }
        .tab-content.active { display: flex; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 80px; background: var(--nav-bg); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(128,128,128,0.1); z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { color: var(--dim); text-align: center; flex: 1; cursor: pointer; font-size: 0.7rem; font-weight: 700; }
        .nav-icon { font-size: 1.6rem; display: block; }
        .nav-item.active { color: var(--accent); }

        .list-container { overflow-y: auto; padding: 15px; flex: 1; }
        .add-btn { background: var(--accent); color: white; border: none; border-radius: 10px; padding: 10px 18px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <!-- HOME TAB -->
    <div id="home" class="tab-content active">
        <div class="home-grid">
            <div class="header-tile">
                <div class="clock-tile"><h1 id="clock">00:00</h1><div id="date-string" style="color:var(--dim)">...</div></div>
                <div class="weather-container" style="text-align: right;">
                    <div style="font-size: 2.2rem; font-weight: 700;"><span id="w-icon">☀️</span> <span id="temp">--°</span></div>
                    <div id="w-condition" style="color:var(--accent); font-weight: 700;">Worcester</div>
                </div>
            </div>
            
            <div class="tile"><h3>🍲 Dinner</h3><div id="home-dinner" style="font-weight: 700; color: var(--accent); font-size: 1.2rem;">...</div></div>
            <div class="tile"><h3>✨ Fun</h3><div id="daily-joke" style="font-size: 0.8rem; color: var(--dim);">...</div></div>
            
            <div class="home-calendar-strip">
                <div class="person-day" style="--c:var(--Michelle)"><h4>Michelle</h4><div id="day-Michelle"></div></div>
                <div class="person-day" style="--c:var(--Paul)"><h4>Paul</h4><div id="day-Paul"></div></div>
                <div class="person-day" style="--c:var(--Ella)"><h4>Ella</h4><div id="day-Ella"></div></div>
                <div class="person-day" style="--c:var(--Ivy)"><h4>Ivy</h4><div id="day-Ivy"></div></div>
            </div>

            <div class="tile" style="grid-column: 1 / -1;"><h3>📝 Latest Note</h3><div id="home-note-preview">...</div></div>
        </div>
    </div>

    <!-- CALENDAR TAB -->
    <div id="calendar" class="tab-content">
        <div style="display:flex; justify-content: space-between; align-items: center; padding: 15px; background: var(--card);">
            <button class="add-btn" onclick="changeMonth(-1)">Prev</button>
            <h2 id="cal-month-title" style="margin:0; font-size: 1.2rem;">Month</h2>
            <button class="add-btn" onclick="changeMonth(1)">Next</button>
        </div>
        <div style="padding: 0 15px 10px; background: var(--card); text-align: center;">
            <button class="add-btn" style="background:var(--Family); width: 100%;" onclick="addHubEvent()">+ Add Hub Event</button>
        </div>
        <div id="month-grid-container" class="week-grid"></div>
    </div>

    <!-- OTHER TABS -->
    <div id="tasks" class="tab-content"><div class="list-container" id="chore-grid-container"></div><button class="add-btn" style="margin:20px" onclick="addTask()">+ New Chore</button></div>
    <div id="meals" class="tab-content"><div class="list-container" id="meal-list"></div></div>
    <div id="groceries" class="tab-content"><div class="list-container" id="grocery-list"></div><button class="add-btn" style="margin:20px" onclick="addGrocery()">+ Add Item</button></div>
    <div id="notes" class="tab-content"><div class="list-container" id="note-list"></div><button class="add-btn" style="margin:20px" onclick="addNote()">+ New Note</button></div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)"><span class="nav-icon">🏠</span>HOME</div>
        <div class="nav-item" onclick="switchTab('calendar', this)"><span class="nav-icon">📅</span>CAL</div>
        <div class="nav-item" onclick="switchTab('tasks', this)"><span class="nav-icon">✅</span>TASKS</div>
        <div class="nav-item" onclick="switchTab('meals', this)"><span class="nav-icon">🍲</span>MEALS</div>
        <div class="nav-item" onclick="switchTab('groceries', this)"><span class="nav-icon">🛒</span>SHOP</div>
        <div class="nav-item" onclick="switchTab('notes', this)"><span class="nav-icon">📝</span>NOTES</div>
    </nav>

    <script>
        const GOOGLE_API_KEY = 'AIzaSyCBb3Uu--Sr21o65TUddUBIPfLfQwZsV_o';
        const FAMILY_CALENDARS = { Michelle: 'malvcomp@gmail.com', Paul: '9f686e18312a637015a36791d26311728da7240728adf8dda932c5cabc13456e@group.calendar.google.com', Ella: '361ba78ae3e35bf7a888ebef5f4cbf436be8049abdfa4680f566e36c1a872e7a@group.calendar.google.com', Ivy: '4993c431444a8a1fe2cc3ff0e4615c2b1b3cc8b53b65b8b5b5c5b4bd06c0aeb7@group.calendar.google.com' };
        
        const firebaseConfig = { apiKey: "AIzaSyCBb3Uu--Sr21o65TUddUBIPfLfQwZsV_o", authDomain: "familyhub-fb842.firebaseapp.com", databaseURL: "https://familyhub-fb842-default-rtdb.firebaseio.com", projectId: "familyhub-fb842", appId: "1:459204148820:web:9808286292bbb322e3b7c1" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let calDate = new Date();

        // 1. ADD EVENT FEATURE
        window.addHubEvent = () => {
            const text = prompt("Event Name:");
            const date = prompt("Date (YYYY-MM-DD):", new Date().toISOString().split('T')[0]);
            const who = prompt("Who? (Michelle, Paul, Ella, Ivy, or Family)", "Family");
            if(text && date) {
                db.ref('hub_events').push({ text, date, who });
                buildMonthCalendar();
            }
        };

        async function fetchEvents(name, tMin, tMax) {
            try {
                let url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(FAMILY_CALENDARS[name])}/events?key=${GOOGLE_API_KEY}&singleEvents=true&orderBy=startTime&timeMin=${tMin}&timeMax=${tMax}&maxResults=50`;
                const res = await fetch(url);
                const data = await res.json();
                return data.items || [];
            } catch(e) { return []; }
        }

        async function buildMonthCalendar() {
            const container = document.getElementById('month-grid-container');
            const y = calDate.getFullYear(); const m = calDate.getMonth();
            const start = new Date(y, m, 1);
            const end = new Date(y, m + 1, 0, 23, 59, 59);
            document.getElementById('cal-month-title').innerText = start.toLocaleDateString('en-GB',{month:'long', year:'numeric'});

            let allEvs = [];
            // Google Events
            for (const name in FAMILY_CALENDARS) {
                const evs = await fetchEvents(name, start.toISOString(), end.toISOString());
                evs.forEach(e => allEvs.push({ summary: e.summary, person: name, key: new Date(e.start.dateTime || e.start.date).toDateString() }));
            }
            // Hub Events (Firebase)
            const hubSnap = await db.ref('hub_events').once('value');
            const hubData = hubSnap.val() || {};
            Object.keys(hubData).forEach(id => {
                const d = new Date(hubData[id].date);
                if(d >= start && d <= end) allEvs.push({ summary: '🏠 ' + hubData[id].text, person: hubData[id].who, key: d.toDateString(), id: id });
            });

            let html = '';
            ['M','T','W','T','F','S','S'].forEach(d => html += `<div style="text-align:center;font-weight:700;color:var(--dim);font-size:0.7rem;">${d}</div>`);
            let blanks = start.getDay() === 0 ? 6 : start.getDay() - 1;
            for(let i=0; i<blanks; i++) html += `<div></div>`;
            for(let i=1; i<=end.getDate(); i++) {
                let curr = new Date(y, m, i);
                let isToday = curr.toDateString() === new Date().toDateString();
                html += `<div class="day-col" style="${isToday ? 'border:1.5px solid var(--accent)' : ''}"><div class="day-header">${i}</div>`;
                allEvs.filter(e => e.key === curr.toDateString()).forEach(e => {
                    html += `<div class="cal-event" style="--c:var(--${e.person})">${e.summary}${e.id ? `<span class="delete-btn" onclick="db.ref('hub_events/${e.id}').remove(); buildMonthCalendar(); event.stopPropagation();">✕</span>` : ''}</div>`;
                });
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        // --- PRESERVED LOGIC FOR CHORES, MEALS, ETC ---
        db.ref('tasks').on('value', snap => {
            const container = document.getElementById('chore-grid-container'); if(!container) return;
            container.innerHTML = ''; const data = snap.val() || {};
            ['Michelle','Paul','Ella','Ivy'].forEach(name => {
                let html = `<div style="background:rgba(255,255,255,0.05); padding:10px; border-radius:10px; margin-bottom:10px; border-left:4px solid var(--${name})"><b>${name}</b><br>`;
                Object.keys(data).forEach(id => {
                    if(data[id].assigned === name) html += `<div style="margin-top:5px; opacity:${data[id].done?0.5:1}" onclick="db.ref('tasks/${id}').update({done:${!data[id].done}})">${data[id].done?'✅':'⬜'} ${data[id].text}</div>`;
                });
                container.innerHTML += html + `</div>`;
            });
        });

        window.switchTab = (id, el) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active'); el.classList.add('active');
            if(id === 'calendar') buildMonthCalendar();
        };

        window.changeMonth = (dir) => { calDate.setMonth(calDate.getMonth() + dir); buildMonthCalendar(); };

        setInterval(() => {
            const n = new Date();
            document.getElementById('clock').innerText = n.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
            document.getElementById('date-string').innerText = n.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'});
        }, 1000);

        buildMonthCalendar();
    </script>
</body>
</html>
