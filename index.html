<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Hub - v2</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000; --card: #111111; --text: #ffffff; --dim: #888;
            /* Family Colors */
            --mom: #e74c3c; --dad: #3498db; --kid1: #2ecc71; --kid2: #f1c40f;
        }

        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden;
            display: flex;
        }

        /* LEFT PANEL: Info & Widgets (30%) */
        .left-panel {
            width: 30%; padding: 40px; border-right: 1px solid #222;
            display: flex; flex-direction: column; gap: 30px;
        }

        .time-widget h1 { font-size: 5rem; margin: 0; font-weight: 700; }
        .time-widget p { font-size: 1.5rem; color: var(--dim); margin: 5px 0; }

        .weather-box { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid #222; }
        .weather-temp { font-size: 2.5rem; font-weight: 700; }

        .widget-box { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid #222; }
        .widget-box h3 { margin: 0 0 15px 0; font-size: 0.9rem; text-transform: uppercase; color: var(--dim); letter-spacing: 1px; }

        .chore-item { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 1.1rem; cursor: pointer; }
        .chore-check { width: 22px; height: 22px; border: 2px solid #444; border-radius: 6px; }
        .chore-item.done .chore-check { background: var(--dad); border-color: var(--dad); position: relative; }
        .chore-item.done .chore-check::after { content: '✓'; color: white; position: absolute; left: 4px; top: -2px; }
        .chore-item.done span { text-decoration: line-through; color: var(--dim); }

        /* RIGHT PANEL: 7-Day Vertical Calendar (70%) */
        .right-panel { width: 70%; padding: 40px; display: flex; flex-direction: column; }

        .family-legend { display: flex; gap: 20px; margin-bottom: 30px; }
        .member { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 1.1rem; }
        .dot { width: 14px; height: 14px; border-radius: 50%; }

        .calendar-grid {
            display: grid; grid-template-columns: repeat(7, 1fr);
            gap: 10px; flex-grow: 1;
        }

        .day-col { background: #080808; border-radius: 15px; display: flex; flex-direction: column; border: 1px solid #111; }
        .day-header { padding: 15px; text-align: center; border-bottom: 1px solid #222; }
        .day-header.today { background: #1a1a1a; border-radius: 15px 15px 0 0; }
        .day-name { font-size: 0.9rem; color: var(--dim); text-transform: uppercase; }
        .day-num { font-size: 1.8rem; font-weight: 700; }

        .event-container { padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
        .event { 
            padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; 
            font-weight: 600; line-height: 1.3; color: #000;
        }

        /* Quotes at bottom */
        .quote-footer { margin-top: auto; padding-top: 20px; font-style: italic; color: var(--dim); text-align: center; }

        /* Interaction */
        .editable:hover { background: #222; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>

    <aside class="left-panel">
        <div class="time-widget">
            <h1 id="clock">00:00</h1>
            <p id="date">Monday, May 4</p>
        </div>

        <div class="weather-box">
            <div class="weather-temp" id="temp">--°F</div>
            <div id="weather-desc" style="color:var(--dim)">Fetching weather...</div>
        </div>

        <div class="widget-box">
            <h3>Chores</h3>
            <div id="chore-list">
                <div class="chore-item" onclick="toggleChore(this)"><div class="chore-check"></div><span>Dishwasher</span></div>
                <div class="chore-item" onclick="toggleChore(this)"><div class="chore-check"></div><span>Dog Walk</span></div>
            </div>
        </div>

        <div class="widget-box">
            <h3>Tonight's Dinner</h3>
            <div class="editable" id="dinner-text" onclick="editDinner()" style="font-size: 1.4rem; font-weight: 600;">Tap to set dinner...</div>
        </div>

        <div class="quote-footer" id="quote">"Home is where the heart is."</div>
    </aside>

    <main class="right-panel">
        <div class="family-legend">
            <div class="member"><div class="dot" style="background:var(--mom)"></div>Mom</div>
            <div class="member"><div class="dot" style="background:var(--dad)"></div>Dad</div>
            <div class="member"><div class="dot" style="background:var(--kid1)"></div>Alex</div>
            <div class="member"><div class="dot" style="background:var(--kid2)"></div>Maya</div>
        </div>

        <div class="calendar-grid" id="calendar-grid">
            <!-- 7 Days will be generated here -->
        </div>
    </main>

    <script>
        // 1. DYNAMIC CALENDAR GENERATION
        function buildCalendar() {
            const grid = document.getElementById('calendar-grid');
            const today = new Date();
            
            for (let i = 0; i < 7; i++) {
                const date = new Date();
                date.setDate(today.getDate() + i);
                
                const isToday = i === 0 ? 'today' : '';
                const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
                const dayNum = date.getDate();

                const dayHtml = `
                    <div class="day-col">
                        <div class="day-header ${isToday}">
                            <div class="day-name">${dayName}</div>
                            <div class="day-num">${dayNum}</div>
                        </div>
                        <div class="event-container">
                            ${i === 0 ? '<div class="event" style="background:var(--mom)">Gym @ 8am</div>' : ''}
                            ${i === 1 ? '<div class="event" style="background:var(--kid1)">Soccer Practice</div>' : ''}
                        </div>
                    </div>
                `;
                grid.innerHTML += dayHtml;
            }
        }
        buildCalendar();

        // 2. WEATHER LOGIC (Enter your address/city)
        const WEATHER_API_KEY = 'YOUR_API_KEY'; 
        const CITY = 'Norton'; // Replace with your home address/city

        async function fetchWeather() {
            try {
                // If you have a key, uncomment below:
                // const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${CITY}&units=imperial&appid=${WEATHER_API_KEY}`);
                // const data = await res.json();
                // document.getElementById('temp').innerText = Math.round(data.main.temp) + '°F';
                // document.getElementById('weather-desc').innerText = data.weather[0].description;
                
                // Mocking for now:
                document.getElementById('temp').innerText = '68°F';
                document.getElementById('weather-desc').innerText = 'Mostly Sunny';
            } catch (e) { console.log("Weather error"); }
        }
        fetchWeather();
        setInterval(fetchWeather, 1800000); // Update every 30 mins

        // 3. INTERACTIVE CHORES & DINNER
        function toggleChore(el) {
            el.classList.toggle('done');
        }

        function editDinner() {
            const newDinner = prompt("What's for dinner tonight?", document.getElementById('dinner-text').innerText);
            if (newDinner) document.getElementById('dinner-text').innerText = newDinner;
        }

        // 4. CLOCK
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            document.getElementById('date').innerText = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
