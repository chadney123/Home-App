<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <title>Family Hub Pro V27</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #000; --card: #141414; --text: #fff; --dim: #888; --accent: #3498db;
            --Michelle: #e74c3c; --Paul: #3498db; --Ella: #2ecc71; --Ivy: #f1c40f;
            --Family: #9b59b6; --nav-bg: #050505;
        }
        body.light-mode { --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --dim: #86868b; --nav-bg: #ffffff; }

        * { box-sizing: border-box; }
        
        body { 
            margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); 
            height: 100dvh; display: flex; flex-direction: column; overflow: hidden; transition: background 0.5s; 
        }
        
        /* THE RESPONSIVE HOME GRID */
        .home-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
            padding: 10px; 
            flex: 1; 
            overflow-y: auto; 
            align-content: start;
        }

        /* MOBILE OVERRIDE: STACK TILES */
        @media (max-width: 600px) {
            .home-grid { grid-template-columns: 1fr; }
            .header-tile { flex-direction: column; align-items: center !important; text-align: center; }
            .weather-container { align-items: center !important; text-align: center !important; margin-top: 10px; }
            .home-calendar-strip { grid-template-columns: 1fr 1fr !important; } /* 2x2 on phone */
        }

        .header-tile { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 10px; }
        .clock-tile h1 { font-size: clamp(3.5rem, 10vw, 6rem); margin: 0; font-weight: 700; letter-spacing: -2px; line-height: 0.9; }
        
        .tile { background: var(--card); border-radius: 18px; padding: 12px; border: 1px solid rgba(128,128,128,0.1); display: flex; flex-direction: column; }
        .tile h3 { margin: 0 0 5px 0; font-size: 0.7rem; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
        
        .weather-main { font-size: 2rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }

        .home-calendar-strip { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .person-day { background: var(--card); border-radius: 12px; padding: 10px; border-top: 4px solid var(--c); min-height: 80px; }
        .person-day h4 { margin: 0 0 5px 0; font-size: 0.9rem; }
        .mini-event { background: var(--c); color: #fff; font-size: 0.8rem; padding: 4px 8px; border-radius: 6px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* CALENDAR SCREEN RESPONSIVENESS */
        .calendar-legend { display: flex; justify-content: center; gap: 10px; padding: 8px; background: var(--card); flex-wrap: wrap; font-size: 0.75rem; }
        .week-grid { 
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 5px; flex: 1; overflow-y: auto; 
        }
        .day-col { background: var(--card); border-radius: 4px; min-height: 70px; display: flex; flex-direction: column; border: 1px solid rgba(128,128,128,0.05); }
        .day-header { font-size: 0.7rem; padding: 2px; text-align: center; }
        .cal-event { font-size: 0.6rem; padding: 2px; margin: 1px; border-radius: 2px; color: white; background: var(--c); line-height: 1; }

        /* NAV STAYS ACCESSIBLE */
        .bottom-nav { 
            height: 70px; background: var(--nav-bg); display: flex; justify-content: space-around; align-items: center; 
            border-top: 1px solid rgba(128,128,128,0.1); padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item { color: var(--dim); text-align: center; flex: 1; cursor: pointer; font-size: 0.6rem; }
        .nav-icon { font-size: 1.4rem; display: block; }
        .nav-item.active { color: var(--accent); }

        .tab-content { display: none; height: calc(100dvh - 70px); width: 100%; flex-direction: column; overflow: hidden; }
        .tab-content.active { display: flex; }
        
        .list-container { flex: 1; overflow-y: auto; padding: 15px; }
        .add-btn { background: var(--accent); color: white; border: none; border-radius: 8px; padding: 8px 12px; font-weight: 700; font-size: 0.8rem; }
    </style>
</head>
<body>

    <!-- HOME TAB -->
    <div id="home" class="tab-content active">
        <div class="home-grid">
            <div class="header-tile">
                <div class="clock-tile"><h1 id="clock">00:00</h1><div id="date-string" style="color:var(--dim)">...</div></div>
                <div class="weather-container">
                    <div class="weather-main"><span id="w-icon">☀️</span> <span id="temp">--°</span></div>
                    <div id="w-condition" style="color:var(--accent); font-weight: 700;">Worcester</div>
                </div>
            </div>
            
            <div class="tile"><h3>🍲 Dinner</h3><div id="home-dinner" style="font-weight: 700; color: var(--accent);">...</div></div>
            <div class="tile"><h3>✨ Fun</h3><div id="daily-joke" style="font-size: 0.75rem; color: var(--dim);">...</div></div>
            
            <div class="home-calendar-strip">
                <div class="person-day" style="--c:var(--Michelle)"><h4>M</h4><div id="day-Michelle"></div></div>
                <div class="person-day" style="--c:var(--Paul)"><h4>P</h4><div id="day-Paul"></div></div>
                <div class="person-day" style="--c:var(--Ella)"><h4>E</h4><div id="day-Ella"></div></div>
                <div class="person-day" style="--c:var(--Ivy)"><h4>I</h4><div id="day-Ivy"></div></div>
            </div>
            
            <div class="tile" style="grid-column: 1 / -1;"><h3>📝 Note</h3><div id="home-note-preview">...</div></div>
        </div>
    </div>

    <!-- CALENDAR TAB -->
    <div id="calendar" class="tab-content">
        <div class="calendar-legend">
            <div class="legend-item" style="color:var(--Michelle)">● Michelle</div>
            <div class="legend-item" style="color:var(--Paul)">● Paul</div>
            <div class="legend-item" style="color:var(--Ella)">● Ella</div>
            <div class="legend-item" style="color:var(--Ivy)">● Ivy</div>
            <div class="legend-item" style="color:var(--Family)">● Hub</div>
        </div>
        <div style="display:flex; justify-content: space-between; padding: 10px; align-items: center;">
            <button class="add-btn" onclick="changeMonth(-1)">Prev</button>
            <b id="cal-month-title">Month</b>
            <button class="add-btn" onclick="changeMonth(1)">Next</button>
        </div>
        <div style="text-align:center; padding-bottom: 10px;">
            <button class="add-btn" style="background:var(--Family)" onclick="addHubEvent()">+ Add Hub Event</button>
        </div>
        <div id="month-grid-container" class="week-grid"></div>
    </div>

    <!-- OTHER TABS (Simplified for Phone) -->
    <div id="tasks" class="tab-content"><div class="list-container" id="chore-grid-container"></div><button class="add-btn" style="margin:10px" onclick="addTask()">+ Chore</button></div>
    <div id="meals" class="tab-content"><div class="list-container" id="meal-list"></div></div>
    <div id="groceries" class="tab-content"><div class="list-container" id="grocery-list"></div><button class="add-btn" style="margin:10px" onclick="addGrocery()">+ Shop</button></div>
    <div id="notes" class="tab-content"><div class="list-container" id="note-list"></div><button class="add-btn" style="margin:10px" onclick="addNote()">+ Note</button></div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)"><span class="nav-icon">🏠</span>HOME</div>
        <div class="nav-item" onclick="switchTab('calendar', this)"><span class="nav-icon">📅</span>CAL</div>
        <div class="nav-item" onclick="switchTab('tasks', this)"><span class="nav-icon">✅</span>TASK</div>
        <div class="nav-item" onclick="switchTab('meals', this)"><span class="nav-icon">🍲</span>MEAL</div>
        <div class="nav-item" onclick="switchTab('groceries', this)"><span class="nav-icon">🛒</span>SHOP</div>
        <div class="nav-item" onclick="switchTab('notes', this)"><span class="nav-icon">📝</span>NOTE</div>
    </nav>

    <script>
        const GOOGLE_API_KEY = 'AIzaSyCBb3Uu--Sr21o65TUddUBIPfLfQwZsV_o';
        const FAMILY_CALENDARS = { Michelle: 'malvcomp@gmail.com', Paul: '9f686e18312a637015a36791d26311728da7240728adf8dda932c5cabc13456e@group.calendar.google.com', Ella: '361ba78ae3e35bf7a888ebef5f4cbf436be8049abdfa4680f566e36c1a872e7a@group.calendar.google.com', Ivy: '4993c431444a8a1fe2cc3ff0e4615c2b1b3cc8b53b65b8b5b5c5b4bd06c0aeb7@group.calendar.google.com' };
        
        const firebaseConfig = { apiKey: "AIzaSyCBb3Uu--Sr21o65TUddUBIPfLfQwZsV_o", authDomain: "familyhub-fb842.firebaseapp.com", databaseURL: "https://familyhub-fb842-default-rtdb.firebaseio.com", projectId: "familyhub-fb842", appId: "1:459204148820:web:9808286292bbb322e3b7c1" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let calDate = new Date();

        async function fetchEvents(name, tMin, tMax) {
            try {
                let url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(FAMILY_CALENDARS[name])}/events?key=${GOOGLE_API_KEY}&singleEvents=true&orderBy=startTime&timeMin=${tMin}`;
                if(tMax) url += `&timeMax=${tMax}`;
                const res = await fetch(url + `&maxResults=20`);
                const data = await res.json();
                return data.items || [];
            } catch(e) { return []; }
        }

        async function buildMonthCalendar() {
            const container = document.getElementById('month-grid-container');
            const y = calDate.getFullYear(); const m = calDate.getMonth();
            const startOfMonth = new Date(y, m, 1);
            const endOfMonth = new Date(y, m + 1, 0, 23, 59, 59);
            document.getElementById('cal-month-title').innerText = startOfMonth.toLocaleDateString('en-GB',{month:'short', year:'numeric'});

            let allEvs = [];
            for (const name in FAMILY_CALENDARS) {
                const evs = await fetchEvents(name, startOfMonth.toISOString(), endOfMonth.toISOString());
                evs.forEach(e => allEvs.push({ summary: e.summary, person: name, key: new Date(e.start.dateTime || e.start.date).toDateString() }));
            }
            const hubSnap = await db.ref('hub_events').once('value');
            const hubData = hubSnap.val() || {};
            Object.keys(hubData).forEach(id => {
                const d = new Date(hubData[id].date);
                if(d >= startOfMonth && d <= endOfMonth) allEvs.push({ summary: '🏠 ' + hubData[id].text, person: hubData[id].who || 'Family', key: d.toDateString(), id: id });
            });

            let html = '';
            ['M','T','W','T','F','S','S'].forEach(d => html += `<div style="text-align:center;font-size:0.6rem;font-weight:700;color:var(--dim)">${d}</div>`);
            let firstDay = startOfMonth.getDay(); let blanks = firstDay === 0 ? 6 : firstDay - 1;
            for(let i=0; i<blanks; i++) html += `<div></div>`;
            for(let i=1; i<=endOfMonth.getDate(); i++) {
                let curr = new Date(y, m, i);
                let isToday = curr.toDateString() === new Date().toDateString();
                html += `<div class="day-col" style="${isToday ? 'border:1px solid var(--accent)' : ''}"><div class="day-header">${i}</div>`;
                allEvs.filter(e => e.key === curr.toDateString()).forEach(e => {
                    html += `<div class="cal-event" style="--c:var(--${e.person})">${e.summary}</div>`;
                });
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        window.addHubEvent = () => {
            const text = prompt("What's happening?");
            const date = prompt("Date (YYYY-MM-DD):", new Date().toISOString().split('T')[0]);
            if(text && date) { db.ref('hub_events').push({ text, date, who: 'Family' }); buildMonthCalendar(); }
        };

        window.switchTab = (id, el) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active'); el.classList.add('active');
            if(id === 'calendar') buildMonthCalendar();
        };

        window.changeMonth = (dir) => { calDate.setMonth(calDate.getMonth() + dir); buildMonthCalendar(); };

        setInterval(() => {
            const n = new Date();
            document.getElementById('clock').innerText = n.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
            document.getElementById('date-string').innerText = n.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
        }, 1000);

        buildMonthCalendar();
    </script>
</body>
</html>
