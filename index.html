<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Hub Pro</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #000; --card: #121212; --text: #fff; --dim: #888; --accent: #3498db;
            --mom: #e74c3c; --dad: #3498db; --kid1: #2ecc71; --kid2: #f1c40f;
        }

        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Navigation Styles */
        .tab-content { flex-grow: 1; display: none; height: 100%; overflow-y: auto; padding-bottom: 100px; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Dashboard Tiles */
        .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; box-sizing: border-box; }
        .header-tile { grid-column: 1 / span 2; display: flex; justify-content: space-between; align-items: center; }
        .clock-tile h1 { font-size: 5rem; margin: 0; font-weight: 700; letter-spacing: -2px; }
        
        .tile { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid #222; }
        .tile h3 { margin: 0 0 10px 0; color: var(--dim); font-size: 0.8rem; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 8px; }

        /* Vertical Calendar Styles */
        .calendar-container { padding: 20px; }
        .vertical-grid { display: grid; grid-template-columns: 80px repeat(4, 1fr); gap: 8px; }
        .name-box { padding: 10px; border-radius: 8px; text-align: center; font-weight: 700; color: #000; font-size: 0.8rem; }
        .day-label { color: var(--dim); text-align: center; font-weight: bold; border-right: 1px solid #222; }
        .calendar-cell { background: #080808; border-radius: 8px; min-height: 80px; border: 1px dashed #222; }

        /* Shared List Styles (Meals, Tasks, Notes) */
        .list-item { display: flex; align-items: center; padding: 12px; background: #1a1a1a; margin-bottom: 8px; border-radius: 12px; cursor: pointer; }
        .meal-day { width: 100px; font-weight: bold; color: var(--accent); }
        .note-card { background: #222; padding: 15px; border-radius: 15px; margin-bottom: 10px; }

        /* Bottom Nav (5 Buttons) */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 85px; background: #0a0a0a; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; }
        .nav-item { color: var(--dim); text-align: center; cursor: pointer; flex: 1; transition: 0.2s; }
        .nav-item.active { color: var(--accent); transform: translateY(-3px); }
        .nav-icon { font-size: 1.5rem; display: block; }
        .nav-text { font-size: 0.7rem; font-weight: 600; }
    </style>
</head>
<body>

    <!-- 1. HOME TAB -->
    <div id="home" class="tab-content active">
        <div class="home-grid">
            <div class="header-tile">
                <div class="clock-tile"><h1 id="clock">00:00</h1><p id="date-string">...</p></div>
                <div style="text-align: right;"><div id="temp" style="font-size: 2.5rem; font-weight: 700;">18°C</div><div style="color:var(--dim)">Evesham, UK</div></div>
            </div>
            <div class="tile" style="grid-column: 1 / span 2;">
                <h3>🍲 Today's Menu</h3>
                <div id="home-dinner" style="font-size: 1.5rem; font-weight: 600;">Loading dinner...</div>
            </div>
            <div class="tile">
                <h3>✅ Today's Tasks</h3>
                <div id="home-tasks-preview" style="font-size: 0.9rem; color: var(--dim);">...</div>
            </div>
            <div class="tile">
                <h3>📝 Latest Note</h3>
                <div id="home-note-preview" style="font-size: 0.9rem;">...</div>
            </div>
        </div>
    </div>

    <!-- 2. CALENDAR TAB -->
    <div id="calendar" class="tab-content">
        <div class="calendar-container">
            <div class="vertical-grid" id="calendar-grid">
                <!-- Generated by JS -->
            </div>
        </div>
    </div>

    <!-- 3. MEALS TAB -->
    <div id="meals" class="tab-content">
        <div style="padding: 20px;">
            <h2>Weekly Meal Plan</h2>
            <div id="meal-list"></div>
        </div>
    </div>

    <!-- 4. TASKS TAB -->
    <div id="tasks" class="tab-content">
        <div style="padding: 20px;">
            <div style="display: flex; justify-content: space-between;"><h2>Tasks & Chores</h2><button onclick="addTask()">+</button></div>
            <div id="task-list"></div>
        </div>
    </div>

    <!-- 5. NOTES TAB -->
    <div id="notes" class="tab-content">
        <div style="padding: 20px;">
            <div style="display: flex; justify-content: space-between;"><h2>Family Notes</h2><button onclick="addNote()">+</button></div>
            <div id="note-list"></div>
        </div>
    </div>

    <!-- 5-BUTTON BOTTOM NAV -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)"><span class="nav-icon">🏠</span><span class="nav-text">Home</span></div>
        <div class="nav-item" onclick="switchTab('calendar', this)"><span class="nav-icon">📅</span><span class="nav-text">Calendar</span></div>
        <div class="nav-item" onclick="switchTab('meals', this)"><span class="nav-icon">🍲</span><span class="nav-text">Meals</span></div>
        <div class="nav-item" onclick="switchTab('tasks', this)"><span class="nav-icon">✅</span><span class="nav-text">Tasks</span></div>
        <div class="nav-item" onclick="switchTab('notes', this)"><span class="nav-icon">📝</span><span class="nav-text">Notes</span></div>
    </nav>

    <script>
        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyCBb3Uu--Sr21o65TUddUBIPfLfQwZsV_o",
            authDomain: "familyhub-fb842.firebaseapp.com",
            databaseURL: "https://familyhub-fb842-default-rtdb.firebaseio.com",
            projectId: "familyhub-fb842",
            storageBucket: "familyhub-fb842.firebasestorage.app",
            messagingSenderId: "459204148820",
            appId: "1:459204148820:web:9808286292bbb322e3b7c1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- CORE LOGIC: DAILY RESET ---
        function checkDailyReset() {
            const today = new Date().toDateString();
            db.ref('lastReset').once('value', (snap) => {
                if (snap.val() !== today) {
                    // New Day! Reset all recurring chores
                    db.ref('tasks').once('value', (tasksSnap) => {
                        const tasks = tasksSnap.val();
                        for (let id in tasks) {
                            if (tasks[id].recurring) db.ref('tasks/' + id).update({ done: false });
                        }
                    });
                    db.ref('lastReset').set(today);
                }
            });
        }
        checkDailyReset();

        // --- TAB SWITCHER ---
        function switchTab(id, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        // --- MEALS LOGIC ---
        const weekdays = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
        db.ref('meals').on('value', (snap) => {
            const meals = snap.val() || {};
            const list = document.getElementById('meal-list');
            list.innerHTML = '';
            
            weekdays.forEach(day => {
                const row = document.createElement('div');
                row.className = 'list-item';
                row.onclick = () => {
                    const m = prompt(`What's for dinner on ${day}?`, meals[day] || "");
                    if (m !== null) db.ref('meals/' + day).set(m);
                };
                row.innerHTML = `<span class="meal-day">${day}</span><span>${meals[day] || "---"}</span>`;
                list.appendChild(row);

                // Update Home Preview if it's today
                const todayName = new Date().toLocaleDateString('en-US', { weekday: 'long' });
                if (day === todayName) document.getElementById('home-dinner').innerText = meals[day] || "No meal set";
            });
        });

        // --- TASKS & NOTES (Simplified) ---
        function addTask() {
            const t = prompt("New Task:");
            if(t) db.ref('tasks').push({ text: t, done: false, recurring: true });
        }
        db.ref('tasks').on('value', (snap) => {
            const list = document.getElementById('task-list');
            list.innerHTML = '';
            const data = snap.val();
            let pendingCount = 0;
            for(let id in data) {
                if(!data[id].done) pendingCount++;
                const item = document.createElement('div');
                item.className = 'list-item';
                item.style.opacity = data[id].done ? '0.4' : '1';
                item.onclick = () => db.ref('tasks/'+id).update({done: !data[id].done});
                item.innerHTML = `<span>${data[id].done ? '✅' : '⭕️'} ${data[id].text}</span>`;
                list.appendChild(item);
            }
            document.getElementById('home-tasks-preview').innerText = `${pendingCount} tasks remaining today.`;
        });

        // --- CLOCK & CALENDAR INIT ---
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            document.getElementById('date-string').innerText = now.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});
        }, 1000);

        function initCalendar() {
            const grid = document.getElementById('calendar-grid');
            let html = '<div style="background:transparent"></div>';
            ['Mom','Dad','Kid1','Kid2'].forEach(n => html += `<div class="name-box" style="background:var(--${n.toLowerCase()})">${n}</div>`);
            for(let i=0; i<7; i++) {
                const d = new Date(); d.setDate(d.getDate()+i);
                html += `<div class="day-label">${d.toLocaleDateString('en-US',{weekday:'short'})}<br>${d.getDate()}</div>`;
                for(let j=0; j<4; j++) html += `<div class="calendar-cell"></div>`;
            }
            grid.innerHTML = html;
        }
        initCalendar();
    </script>
</body>
</html>
