<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Hub Pro</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #000; --card: #141414; --text: #fff; --dim: #888; --accent: #3498db;
            --Michelle: #e74c3c; --Paul: #3498db; --Ella: #2ecc71; --Ivy: #f1c40f;
            --grad: linear-gradient(135deg, #3498db, #2980b9);
        }

        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .tab-content { flex-grow: 1; display: none; height: 100%; overflow-y: auto; padding-bottom: 120px; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- HOME SCREEN --- */
        .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; box-sizing: border-box; }
        .header-tile { grid-column: 1 / span 2; display: flex; justify-content: space-between; align-items: center; }
        .clock-tile h1 { font-size: 5.5rem; margin: 0; font-weight: 700; letter-spacing: -3px; }
        .tile { background: var(--card); border-radius: 24px; padding: 20px; border: 1px solid #222; }
        .tile h3 { margin: 0 0 12px 0; color: var(--dim); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }

        /* --- DAY VIEW STRIP --- */
        .home-calendar-strip { grid-column: 1 / span 2; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 5px; }
        .person-day { background: #0a0a0a; border-radius: 15px; padding: 15px; border-top: 4px solid var(--c); min-height: 70px; }
        .person-day h4 { margin: 0 0 8px 0; font-size: 0.9rem; }
        .event-mini { font-size: 0.7rem; color: #fff; background: rgba(255,255,255,0.1); padding: 3px 6px; border-radius: 4px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* --- 7-DAY CALENDAR GRID --- */
        .legend-container { display: flex; justify-content: center; gap: 20px; padding: 20px; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 0.9rem; }
        .legend-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--c); }
        .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; padding: 0 20px; }
        .day-col { background: #111; border-radius: 12px; border: 1px solid #222; min-height: 500px; display: flex; flex-direction: column; }
        .day-header { text-align: center; padding: 12px 5px; background: #1a1a1a; border-radius: 12px 12px 0 0; border-bottom: 2px solid #222; }
        .day-header .day-name { font-size: 0.8rem; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
        .day-header .day-num { font-size: 1.5rem; font-weight: bold; }
        .day-events { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .cal-event { background: rgba(255,255,255,0.05); border-left: 4px solid var(--c); padding: 8px; border-radius: 6px; font-size: 0.85rem; }
        .cal-event-time { font-size: 0.7rem; color: var(--dim); margin-bottom: 2px; }

        /* --- SCREENSAVER --- */
        #screensaver { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; display: none; justify-content: center; align-items: center; background-size: cover; background-position: center; transition: 2s; }
        #screensaver::before { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); }
        #ss-clock { font-size: 10rem; font-weight: 300; position: relative; z-index: 10000; color: white; margin: 0; }

        /* --- BOTTOM NAV --- */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 85px; background: #050505; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; }
        .nav-item { color: var(--dim); text-align: center; cursor: pointer; flex: 1; display: flex; flex-direction: column; align-items: center; }
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 1.6rem; }
        .nav-text { font-size: 0.65rem; font-weight: 600; text-transform: uppercase; }

        @media (max-width: 768px) {
            .home-grid { grid-template-columns: 1fr; }
            .week-grid { grid-template-columns: 1fr; }
            .day-col { min-height: auto; }
            #ss-clock { font-size: 6rem; }
        }
    </style>
</head>
<body onmousemove="resetTimer()" onclick="resetTimer()" ontouchstart="resetTimer()">

    <div id="screensaver" onclick="hideScreensaver()"><h1 id="ss-clock">00:00</h1></div>

    <div id="home" class="tab-content active">
        <div class="home-grid">
            <div class="header-tile">
                <div class="clock-tile"><h1 id="clock">00:00</h1><p id="date-string">...</p></div>
                <div style="text-align: right;"><div id="temp">18°C</div><div style="color:var(--dim)">Evesham</div></div>
            </div>
            <div class="tile"><h3>🍲 Dinner</h3><div id="home-dinner">Loading...</div></div>
            <div class="tile"><h3>✅ Tasks</h3><div id="home-tasks-preview">No tasks</div></div>
            <div class="tile" style="grid-column: 1 / span 2;"><h3>📝 Latest Note</h3><div id="home-note-preview">No notes.</div></div>
            <div class="home-calendar-strip">
                <div class="person-day" style="--c:var(--Michelle)"><h4>Michelle</h4><div id="day-Michelle">Syncing...</div></div>
                <div class="person-day" style="--c:var(--Paul)"><h4>Paul</h4><div id="day-Paul">Syncing...</div></div>
                <div class="person-day" style="--c:var(--Ella)"><h4>Ella</h4><div id="day-Ella">Syncing...</div></div>
                <div class="person-day" style="--c:var(--Ivy)"><h4>Ivy</h4><div id="day-Ivy">Syncing...</div></div>
            </div>
        </div>
    </div>

    <div id="calendar" class="tab-content">
        <div class="legend-container">
            <div class="legend-item"><div class="legend-dot" style="--c:var(--Michelle)"></div>Michelle</div>
            <div class="legend-item"><div class="legend-dot" style="--c:var(--Paul)"></div>Paul</div>
            <div class="legend-item"><div class="legend-dot" style="--c:var(--Ella)"></div>Ella</div>
            <div class="legend-item"><div class="legend-dot" style="--c:var(--Ivy)"></div>Ivy</div>
        </div>
        <div id="week-grid-container"></div>
    </div>

    <div id="meals" class="tab-content"><div style="padding:20px;"><h2>Meals</h2><div id="meal-list"></div></div></div>
    <div id="tasks" class="tab-content"><div style="padding:20px;"><h2>Tasks</h2><div id="task-list"></div></div></div>
    <div id="groceries" class="tab-content"><div style="padding:20px;"><h2>Groceries</h2><div id="grocery-list"></div></div></div>
    <div id="notes" class="tab-content"><div style="padding:20px;"><h2>Notes</h2><div id="note-list"></div></div></div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)"><span class="nav-icon">🏠</span><span class="nav-text">Home</span></div>
        <div class="nav-item" onclick="switchTab('calendar', this)"><span class="nav-icon">📅</span><span class="nav-text">Calendar</span></div>
        <div class="nav-item" onclick="switchTab('meals', this)"><span class="nav-icon">🍲</span><span class="nav-text">Meals</span></div>
        <div class="nav-item" onclick="switchTab('tasks', this)"><span class="nav-icon">✅</span><span class="nav-text">Tasks</span></div>
        <div class="nav-item" onclick="switchTab('groceries', this)"><span class="nav-icon">🛒</span><span class="nav-text">Groceries</span></div>
        <div class="nav-item" onclick="switchTab('notes', this)"><span class="nav-icon">📝</span><span class="nav-text">Notes</span></div>
    </nav>

    <script>
        // --- DATA PLUGGED IN ---
        const GOOGLE_API_KEY = 'AIzaSyCBb3Uu--Sr21o65TUddUBIPfLfQwZsV_o';
        const FAMILY_CALENDARS = {
            Michelle: 'malvcomp@gmail.com',
            Paul: '9f686e18312a637015a36791d26311728da7240728adf8dda932c5cabc13456e@group.calendar.google.com',
            Ella: '361ba78ae3e35bf7a888ebef5f4cbf436be8049abdfa4680f566e36c1a872e7a@group.calendar.google.com',
            Ivy: '4993c431444a8a1fe2cc3ff0e4615c2b1b3cc8b53b65b8b5b5c5b4bd06c0aeb7@group.calendar.google.com'
        };

        const firebaseConfig = {
            apiKey: "AIzaSyCBb3Uu--Sr21o65TUddUBIPfLfQwZsV_o",
            authDomain: "familyhub-fb842.firebaseapp.com",
            databaseURL: "https://familyhub-fb842-default-rtdb.firebaseio.com",
            projectId: "familyhub-fb842",
            storageBucket: "familyhub-fb842.firebasestorage.app",
            messagingSenderId: "459204148820",
            appId: "1:459204148820:web:9808286292bbb322e3b7c1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- CALENDAR LOGIC ---
        async function fetchEvents(name, limit = 15) {
            const email = FAMILY_CALENDARS[name];
            const timeMin = new Date().toISOString();
            const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(email)}/events?key=${GOOGLE_API_KEY}&timeMin=${timeMin}&singleEvents=true&orderBy=startTime&maxResults=${limit}`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                return data.items || [];
            } catch (e) { return null; }
        }

        async function buildWeeklyCalendar() {
            const container = document.getElementById('week-grid-container');
            container.innerHTML = '<p style="text-align:center; color:var(--dim);">Syncing events...</p>';
            let allEvents = [];
            for (const name in FAMILY_CALENDARS) {
                const events = await fetchEvents(name, 15);
                if (events) events.forEach(e => {
                    let d = new Date(e.start.dateTime || e.start.date);
                    allEvents.push({ ...e, person: name, timeObj: d, key: d.toDateString() });
                });
            }
            allEvents.sort((a,b) => a.timeObj - b.timeObj);
            const days = []; for(let i=0; i<7; i++) { let d = new Date(); d.setDate(d.getDate()+i); days.push(d); }
            let html = '<div class="week-grid">';
            days.forEach(day => {
                html += `<div class="day-col"><div class="day-header"><div class="day-name">${day.toLocaleDateString('en-GB',{weekday:'short'})}</div><div class="day-num">${day.getDate()}</div></div><div class="day-events">`;
                const dayEvs = allEvents.filter(e => e.key === day.toDateString());
                if (dayEvs.length === 0) html += '<div style="text-align:center; color:#333; padding-top:20px;">Free</div>';
                else dayEvs.forEach(e => {
                    const time = e.start.dateTime ? e.timeObj.toLocaleTimeString([],{hour:'2-digit', minute:'2-digit'}) : 'All Day';
                    html += `<div class="cal-event" style="--c:var(--${e.person})"><div class="cal-event-time">${time}</div><b>${e.summary}</b></div>`;
                });
                html += '</div></div>';
            });
            container.innerHTML = html + '</div>';
        }

        async function syncHomeStrip() {
            for (const name in FAMILY_CALENDARS) {
                const events = await fetchEvents(name, 2);
                const cont = document.getElementById(`day-${name}`);
                if (events && events.length > 0) {
                    cont.innerHTML = '';
                    events.forEach(e => {
                        const div = document.createElement('div'); div.className = 'event-mini'; div.innerText = e.summary; cont.appendChild(div);
                    });
                } else { cont.innerText = 'Free'; }
            }
        }

        // --- UI LOGIC ---
        window.switchTab = (id, el) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active'); el.classList.add('active');
            if(id === 'calendar') buildWeeklyCalendar();
            if(id === 'home') syncHomeStrip();
        };

        const ssPhotos = ["https://images.unsplash.com/photo-1511895426328-dc8714191300?w=1080", "https://images.unsplash.com/photo-1542037104857-ffbb0b9155fb?w=1080"];
        let pIdx = 0, idleTime = 0;
        function resetTimer() { idleTime = 0; document.getElementById('screensaver').style.display = 'none'; }
        setInterval(() => {
            idleTime++;
            if (idleTime >= 120) {
                const ss = document.getElementById('screensaver');
                ss.style.display = 'flex'; ss.style.backgroundImage = `url('${ssPhotos[pIdx]}')`;
                pIdx = (pIdx + 1) % ssPhotos.length;
            }
        }, 10000);

        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            document.getElementById('ss-clock').innerText = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            document.getElementById('date-string').innerText = now.toLocaleDateString('en-GB', {weekday:'long', month:'long', day:'numeric'});
        }, 1000);

        syncHomeStrip();
        buildWeeklyCalendar();
    </script>
</body>
</html>
