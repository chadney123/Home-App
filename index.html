<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>Family Hub Pro V17</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #000; --card: #141414; --text: #fff; --dim: #888; --accent: #3498db;
            --Michelle: #e74c3c; --Paul: #3498db; --Ella: #2ecc71; --Ivy: #f1c40f;
            --nav-bg: #050505;
        }
        body.light-mode { --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --dim: #86868b; --nav-bg: #ffffff; }

        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; transition: background 0.5s; }
        
        #brightness-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10001; background: black; opacity: 0; transition: opacity 2s; }
        .tab-content { flex-grow: 1; display: none; height: 100%; overflow-y: auto; padding-bottom: 90px; }
        .tab-content.active { display: block; }

        /* HOME GRID - ENLARGED */
        .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
        .header-tile { grid-column: 1 / span 2; display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .clock-tile h1 { font-size: 6rem; margin: 0; font-weight: 700; letter-spacing: -4px; line-height: 0.85; }
        .date-text { font-size: 1.2rem; margin-top: 5px; color: var(--dim); font-weight: 500; }
        
        .tile { background: var(--card); border-radius: 24px; padding: 20px; border: 1px solid rgba(128,128,128,0.1); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .tile h3 { margin: 0 0 10px 0; font-size: 1rem; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
        
        /* UPDATED WEATHER LAYOUT */
        .weather-container { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
        .weather-main { font-size: 2.8rem; font-weight: 700; display: flex; align-items: center; gap: 8px; line-height: 1; }
        .weather-forecast { display: flex; gap: 15px; margin-top: 15px; width: 100%; justify-content: flex-end; border-top: 1px solid rgba(128,128,128,0.1); padding-top: 10px; }
        .forecast-day { text-align: center; font-size: 0.85rem; color: var(--dim); line-height: 1.4; min-width: 45px; }

        .home-calendar-strip { grid-column: 1 / span 2; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .person-day { background: var(--card); border-radius: 18px; padding: 15px; border-top: 6px solid var(--c); min-height: 80px; }
        .person-day h4 { margin: 0 0 8px 0; font-size: 1rem; }
        .mini-event { font-size: 0.8rem; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* LISTS */
        .list-item { display: flex; align-items: center; justify-content: space-between; padding: 14px; background: var(--card); margin-bottom: 8px; border-radius: 14px; border: 1px solid rgba(128,128,128,0.1); font-size: 1rem; }
        .edit-btn { background: var(--accent); color: white; border: none; border-radius: 8px; padding: 8px 16px; cursor: pointer; font-size: 0.9rem; font-weight: 600; }

        /* CALENDAR */
        .calendar-legend { display: flex; justify-content: center; gap: 20px; padding: 15px; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.9rem; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; padding: 10px; height: 75%; }
        .day-col { background: var(--card); border-radius: 12px; border: 1px solid rgba(128,128,128,0.1); }
        .day-header { text-align: center; padding: 12px 2px; border-bottom: 1px solid rgba(128,128,128,0.1); }
        .cal-event { background: rgba(128,128,128,0.1); border-left: 4px solid var(--c); padding: 6px; border-radius: 4px; font-size: 0.75rem; margin: 4px; }

        /* NAV */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 80px; background: var(--nav-bg); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(128,128,128,0.1); z-index: 100; }
        .nav-item { color: var(--dim); text-align: center; flex: 1; padding: 10px 0; }
        .nav-icon { font-size: 2rem; display: block; }
        .nav-label { font-size: 0.7rem; font-weight: 700; margin-top: 4px; }
        .nav-item.active { color: var(--accent); }

        /* SCREENSAVER */
        #screensaver { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; background: black; color: white; text-align: center; }
        #ss-clock { font-size: 10rem; font-weight: 700; margin: 0; }
    </style>
</head>
<body onmousemove="resetTimer()" onclick="resetTimer()" ontouchstart="resetTimer()">

    <div id="brightness-overlay"></div>

    <div id="screensaver" onclick="resetTimer()">
        <div id="ss-info">
            <h1 id="ss-clock">00:00</h1>
            <div id="ss-date" style="font-size: 2rem; opacity: 0.8;">...</div>
            <div id="ss-weather" style="font-size: 2.5rem; margin: 25px 0;">...</div>
            <div id="ss-agenda"></div>
        </div>
    </div>

    <!-- HOME -->
    <div id="home" class="tab-content active">
        <div class="home-grid">
            <div class="header-tile">
                <div class="clock-tile">
                    <h1 id="clock">00:00</h1>
                    <p id="date-string" class="date-text">...</p>
                </div>
                <div class="weather-container">
                    <div class="weather-main"><span id="w-icon">☀️</span> <span id="temp">--°</span></div>
                    <div style="color:var(--accent); font-weight: 700; font-size: 1.1rem; margin: 4px 0;">Worcester</div>
                    <div id="w-condition" style="color:var(--dim); font-size: 0.9rem; text-transform: capitalize;">Checking...</div>
                    <div class="weather-forecast" id="forecast-cont"></div>
                </div>
            </div>
            
            <div class="tile"><h3>🍲 Dinner</h3><div id="home-dinner" style="font-size: 1.5rem; color: var(--accent); font-weight: 700;">...</div></div>
            <div class="tile">
                <h3>✨ Daily Focus</h3>
                <div id="daily-quote" style="font-style: italic; color: var(--accent); margin-bottom: 8px; font-size: 0.9rem; line-height: 1.3;">"Loading motivation..."</div>
                <div id="daily-joke" style="font-size: 0.85rem; border-top: 1px solid rgba(128,128,128,0.1); padding-top:8px; color: var(--dim);">...</div>
            </div>
            
            <div class="tile" style="grid-column: 1 / span 2;"><h3>📝 Latest Note</h3><div id="home-note-preview" style="font-size: 1.1rem; min-height: 1.5em;">...</div></div>
            
            <div class="home-calendar-strip">
                <div class="person-day" style="--c:var(--Michelle)"><h4>Michelle</h4><div id="day-Michelle"></div></div>
                <div class="person-day" style="--c:var(--Paul)"><h4>Paul</h4><div id="day-Paul"></div></div>
                <div class="person-day" style="--c:var(--Ella)"><h4>Ella</h4><div id="day-Ella"></div></div>
                <div class="person-day" style="--c:var(--Ivy)"><h4>Ivy</h4><div id="day-Ivy"></div></div>
            </div>
        </div>
    </div>

    <!-- TABS (Kept as V16) -->
    <div id="calendar" class="tab-content">
        <div class="calendar-legend">
            <div class="legend-item"><div class="dot" style="background:var(--Michelle)"></div>Michelle</div>
            <div class="legend-item"><div class="dot" style="background:var(--Paul)"></div>Paul</div>
            <div class="legend-item"><div class="dot" style="background:var(--Ella)"></div>Ella</div>
            <div class="legend-item"><div class="dot" style="background:var(--Ivy)"></div>Ivy</div>
        </div>
        <div id="week-grid-container"></div>
    </div>
    <div id="meals" class="tab-content"><div style="padding:20px;"><h2>Meal Planner</h2><div id="meal-list"></div></div></div>
    <div id="tasks" class="tab-content"><div style="padding:20px; display:flex; justify-content:space-between;"><h2>Family Tasks</h2><button class="edit-btn" onclick="addTask()">+ New Task</button></div><div id="task-list" style="padding:0 20px;"></div></div>
    <div id="groceries" class="tab-content"><div style="padding:20px; display:flex; justify-content:space-between;"><h2>Shopping List</h2><button class="edit-btn" onclick="addGrocery()">+ Add Item</button></div><div id="grocery-list" style="padding:0 20px;"></div></div>
    <div id="notes" class="tab-content"><div style="padding:20px; display:flex; justify-content:space-between;"><h2>Notes</h2><button class="edit-btn" onclick="addNote()">+ New Note</button></div><div id="note-list" style="padding:0 20px;"></div></div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)"><span class="nav-icon">🏠</span><span class="nav-label">HOME</span></div>
        <div class="nav-item" onclick="switchTab('calendar', this)"><span class="nav-icon">📅</span><span class="nav-label">CALENDAR</span></div>
        <div class="nav-item" onclick="switchTab('meals', this)"><span class="nav-icon">🍲</span><span class="nav-label">MEALS</span></div>
        <div class="nav-item" onclick="switchTab('tasks', this)"><span class="nav-icon">✅</span><span class="nav-label">TASKS</span></div>
        <div class="nav-item" onclick="switchTab('groceries', this)"><span class="nav-icon">🛒</span><span class="nav-label">SHOP</span></div>
        <div class="nav-item" onclick="switchTab('notes', this)"><span class="nav-icon">📝</span><span class="nav-label">NOTES</span></div>
    </nav>

    <script>
        const GOOGLE_API_KEY = 'AIzaSyCBb3Uu--Sr21o65TUddUBIPfLfQwZsV_o';
        const FAMILY_CALENDARS = { Michelle: 'malvcomp@gmail.com', Paul: '9f686e18312a637015a36791d26311728da7240728adf8dda932c5cabc13456e@group.calendar.google.com', Ella: '361ba78ae3e35bf7a888ebef5f4cbf436be8049abdfa4680f566e36c1a872e7a@group.calendar.google.com', Ivy: '4993c431444a8a1fe2cc3ff0e4615c2b1b3cc8b53b65b8b5b5c5b4bd06c0aeb7@group.calendar.google.com' };
        
        const firebaseConfig = { apiKey: "AIzaSyCBb3Uu--Sr21o65TUddUBIPfLfQwZsV_o", authDomain: "familyhub-fb842.firebaseapp.com", databaseURL: "https://familyhub-fb842-default-rtdb.firebaseio.com", projectId: "familyhub-fb842", appId: "1:459204148820:web:9808286292bbb322e3b7c1" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // WEATHER
        const weatherMap = { 0: ["☀️", "Clear"], 1: ["🌤️", "Fair"], 2: ["⛅", "Cloudy"], 3: ["☁️", "Overcast"], 61: ["🌧️", "Rain"], 80: ["🌧️", "Showers"], 95: ["⛈️", "Storm"] };
        async function fetchWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=52.19&longitude=-2.22&daily=weathercode,temperature_2m_max&current_weather=true&timezone=Europe%2FLondon');
                const data = await res.json();
                const cur = data.current_weather;
                const info = weatherMap[cur.weathercode] || ["☀️", "Clear"];
                document.getElementById('temp').innerText = Math.round(cur.temperature) + '°';
                document.getElementById('w-icon').innerText = info[0];
                document.getElementById('w-condition').innerText = info[1];
                document.getElementById('ss-weather').innerText = `${info[0]} ${Math.round(cur.temperature)}° Worcester`;
                let fHtml = '';
                const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
                for(let i=1; i<4; i++) {
                    let d = new Date(); d.setDate(d.getDate() + i);
                    let icon = weatherMap[data.daily.weathercode[i]] ? weatherMap[data.daily.weathercode[i]][0] : "☀️";
                    fHtml += `<div class="forecast-day">${dayNames[d.getDay()]}<br>${icon}<br><b>${Math.round(data.daily.temperature_2m_max[i])}°</b></div>`;
                }
                document.getElementById('forecast-cont').innerHTML = fHtml;
            } catch(e) {}
        }

        // CALENDAR (Auto-updates via Interval)
        async function fetchEvents(name) {
            const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(FAMILY_CALENDARS[name])}/events?key=${GOOGLE_API_KEY}&timeMin=${new Date().toISOString()}&singleEvents=true&orderBy=startTime&maxResults=5`;
            const res = await fetch(url); const data = await res.json(); return data.items || [];
        }

        async function updateAgendas() {
            const today = new Date().toDateString();
            let ssHtml = '';
            for (const name in FAMILY_CALENDARS) {
                const evs = await fetchEvents(name);
                const homeCont = document.getElementById(`day-${name}`);
                homeCont.innerHTML = '';
                let personEvents = evs.filter(e => new Date(e.start.dateTime || e.start.date).toDateString() === today).slice(0,2);
                personEvents.forEach(e => { homeCont.innerHTML += `<div class="mini-event">• ${e.summary}</div>`; });
                if(homeCont.innerHTML === '') homeCont.innerHTML = '<span style="color:var(--dim); font-size:0.7rem;">Clear</span>';
                if(personEvents.length > 0) ssHtml += `<div class="ss-person" style="--c:var(--${name})"><b>${name}</b><br>${personEvents[0].summary}</div>`;
            }
            document.getElementById('ss-agenda').innerHTML = ssHtml;
        }

        // MOTIVATIONAL FUN
        async function fetchFun() {
            try {
                // Kid-friendly Safe Jokes
                const jRes = await fetch('https://v2.jokeapi.dev/joke/Any?safe-mode&type=single');
                const jData = await jRes.json();
                document.getElementById('daily-joke').innerText = jData.joke || "Why did the chicken cross the road? To get to the other side!";
                
                // Motivational Quotes
                const qRes = await fetch('https://dummyjson.com/quotes/random');
                const qData = await qRes.json();
                document.getElementById('daily-quote').innerText = `"${qData.quote}" — ${qData.author}`;
            } catch(e) { console.log("Fun API Error"); }
        }

        // SYSTEM & AUTO-REFRESH
        function updateSystemState() {
            const h = new Date().getHours();
            const ov = document.getElementById('brightness-overlay');
            if (h >= 7 && h < 19) document.body.classList.add('light-mode'); else document.body.classList.remove('light-mode');
            if (h >= 0 && h < 6) ov.style.opacity = "1"; else if (h >= 21 || h < 7) ov.style.opacity = "0.5"; else ov.style.opacity = "0";
        }

        setInterval(() => {
            const n = new Date();
            const tStr = n.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
            const dStr = n.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
            document.getElementById('clock').innerText = tStr;
            document.getElementById('ss-clock').innerText = tStr;
            document.getElementById('date-string').innerText = dStr;
            document.getElementById('ss-date').innerText = dStr;
            updateSystemState();
        }, 1000);

        // Auto-refresh data every 10 minutes
        setInterval(() => {
            updateAgendas();
            fetchWeather();
            fetchFun();
        }, 600000);

        let idle = 0;
        function resetTimer() { idle = 0; document.getElementById('screensaver').style.display = 'none'; }
        setInterval(() => { idle++; if(idle >= 30) document.getElementById('screensaver').style.display = 'flex'; }, 10000);

        // INITIAL LOAD
        fetchWeather(); updateAgendas(); fetchFun();

        // REST OF TABS (STRICTLY UNCHANGED LOGIC)
        window.switchTab = (id, el) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active'); el.classList.add('active');
            if(id === 'calendar') buildWeeklyCalendar();
        };

        async function buildWeeklyCalendar() {
            const container = document.getElementById('week-grid-container');
            container.innerHTML = '<p style="text-align:center; padding:50px;">Syncing...</p>';
            let allEvs = [];
            for (const name in FAMILY_CALENDARS) {
                const evs = await fetchEvents(name);
                evs.forEach(e => {
                    let d = new Date(e.start.dateTime || e.start.date);
                    allEvs.push({ ...e, person: name, key: d.toDateString() });
                });
            }
            const days = []; for(let i=0; i<7; i++) { let d = new Date(); d.setDate(d.getDate()+i); days.push(d); }
            let html = '<div class="week-grid">';
            days.forEach(day => {
                html += `<div class="day-col"><div class="day-header"><small>${day.toLocaleDateString('en-GB',{weekday:'short'})}</small><br><b>${day.getDate()}</b></div>`;
                allEvs.filter(e => e.key === day.toDateString()).forEach(e => {
                    html += `<div class="cal-event" style="--c:var(--${e.person})">${e.summary}</div>`;
                });
                html += '</div>';
            });
            container.innerHTML = html + '</div>';
        }

        // FIREBASE SYNC (TASKS, GROCERIES, NOTES, MEALS)
        window.addNote = () => { const t = prompt("Note:"); if(t) db.ref('notes').push({ text: t }); };
        db.ref('notes').on('value', snap => {
            const list = document.getElementById('note-list'); list.innerHTML = '';
            const data = snap.val(); let last = "No notes";
            if(data) {
                Object.keys(data).reverse().forEach(id => {
                    last = data[id].text;
                    list.innerHTML += `<div class="list-item"><span>${data[id].text}</span><button style="color:red; background:none; border:none;" onclick="db.ref('notes/${id}').remove()">✕</button></div>`;
                });
            }
            document.getElementById('home-note-preview').innerText = last;
        });
        window.addTask = () => { const t = prompt("Task:"); if(t) db.ref('tasks').push({ text: t, done: false }); };
        db.ref('tasks').on('value', snap => {
            const list = document.getElementById('task-list'); list.innerHTML = '';
            const data = snap.val();
            for(let id in data) list.innerHTML += `<div class="list-item"><span style="text-decoration:${data[id].done?'line-through':''}" onclick="db.ref('tasks/${id}').update({done:${!data[id].done}})">${data[id].text}</span><button style="color:red; background:none; border:none;" onclick="db.ref('tasks/${id}').remove()">✕</button></div>`;
        });
        window.addGrocery = () => { const t = prompt("Item:"); if(t) db.ref('groceries').push({ text: t, done: false }); };
        db.ref('groceries').on('value', snap => {
            const list = document.getElementById('grocery-list'); list.innerHTML = '';
            const data = snap.val();
            for(let id in data) list.innerHTML += `<div class="list-item"><span style="text-decoration:${data[id].done?'line-through':''}" onclick="db.ref('groceries/${id}').update({done:${!data[id].done}})">${data[id].text}</span><button style="color:red; background:none; border:none;" onclick="db.ref('groceries/${id}').remove()">✕</button></div>`;
        });
        db.ref('meals').on('value', snap => {
            const m = snap.val() || {}; const list = document.getElementById('meal-list'); list.innerHTML = '';
            ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].forEach(day => {
                list.innerHTML += `<div class="list-item"><div><b>${day}</b><br><small>${m[day] || '---'}</small></div><button class="edit-btn" onclick="const n=prompt('Dinner?'); if(n)db.ref('meals/${day}').set(n)">Edit</button></div>`;
            });
            document.getElementById('home-dinner').innerText = m[new Date().toLocaleDateString('en-US',{weekday:'long'})] || "Not Set";
        });
    </script>
</body>
</html>
