<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Hub - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --card-bg: #111111;
            --text-main: #ffffff;
            --text-dim: #888888;
            --accent-blue: #3498db;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --accent-orange: #f39c12;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header: Time, Date, Weather */
        .header {
            padding: 40px 50px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .time-section h1 {
            font-size: 7rem;
            margin: 0;
            font-weight: 700;
            line-height: 1;
        }

        .time-section p {
            font-size: 1.8rem;
            color: var(--text-dim);
            margin: 10px 0 0 5px;
        }

        .weather-widget {
            text-align: right;
            background: var(--card-bg);
            padding: 20px 30px;
            border-radius: 25px;
            border: 1px solid #222;
        }

        .weather-temp { font-size: 3rem; font-weight: 700; color: var(--accent-blue); }
        .weather-desc { font-size: 1.2rem; color: var(--text-dim); text-transform: capitalize; }

        /* Main Grid: Calendar, Chores, Dinner */
        .home-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            grid-template-rows: 1fr 200px; /* Top row for lists, bottom for dinner/quote */
            gap: 20px;
            padding: 0 50px 30px 50px;
            flex-grow: 1;
        }

        .tile {
            background: var(--card-bg);
            border-radius: 30px;
            padding: 25px;
            border: 1px solid #222;
            position: relative;
            overflow: hidden;
        }

        .tile h2 {
            margin: 0 0 20px 0;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* List Styling */
        .list-item {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #222;
            font-size: 1.2rem;
        }

        .list-item:last-child { border: none; }

        .time-label {
            color: var(--accent-red);
            font-weight: 700;
            width: 100px;
            font-size: 1rem;
        }

        .chore-check {
            width: 25px;
            height: 25px;
            border: 2px solid var(--accent-green);
            border-radius: 50%;
            margin-right: 15px;
        }

        /* Special Tiles */
        .dinner-tile { grid-column: 1; background: linear-gradient(145deg, #111, #1a1a1a); }
        .quote-tile { grid-column: 2; display: flex; align-items: center; justify-content: center; text-align: center; font-style: italic; color: #ccc; }

        .dinner-tag {
            background: var(--accent-orange);
            color: black;
            padding: 5px 15px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 10px;
            display: inline-block;
        }

    </style>
</head>
<body>

    <header class="header">
        <div class="time-section">
            <h1 id="clock">00:00</h1>
            <p id="full-date">Monday, January 1st</p>
        </div>
        <div class="weather-widget">
            <div class="weather-temp" id="weather-temp">--°</div>
            <div class="weather-desc" id="weather-desc">Loading...</div>
        </div>
    </header>

    <main class="home-grid">
        <!-- Today's Calendar -->
        <section class="tile">
            <h2><span>📅</span> Today's Events</h2>
            <div id="calendar-list">
                <div class="list-item"><span class="time-label">09:00 AM</span> Morning Standup</div>
                <div class="list-item"><span class="time-label">03:30 PM</span> Kids Swimming</div>
                <div class="list-item"><span class="time-label">07:00 PM</span> Dinner Reservation</div>
            </div>
        </section>

        <!-- Chores -->
        <section class="tile">
            <h2><span>✅</span> Chores of the Day</h2>
            <div id="chore-list">
                <div class="list-item"><div class="chore-check"></div> Dishwasher</div>
                <div class="list-item"><div class="chore-check"></div> Fold Laundry</div>
                <div class="list-item"><div class="chore-check"></div> Vacuum Living Room</div>
            </div>
        </section>

        <!-- Dinner -->
        <section class="tile dinner-tile">
            <div class="dinner-tag">TONIGHT'S MENU</div>
            <h1 style="margin:10px 0 0 0; font-size: 2.5rem;" id="dinner-text">Grilled Salmon & Asparagus</h1>
        </section>

        <!-- Quote -->
        <section class="tile quote-tile">
            <p id="quote-text" style="font-size: 1.2rem; line-height: 1.5;">
                "The secret of getting ahead is getting started."
            </p>
        </section>
    </main>

    <script>
        // 1. CLOCK & DATE
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: true});
            
            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            document.getElementById('full-date').innerText = now.toLocaleDateString('en-US', options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. RANDOM QUOTE LOGIC
        const quotes = [
            "Family is not an important thing. It's everything.",
            "The best way to predict the future is to create it.",
            "Home is where our story begins.",
            "Happiness is homemade.",
            "The only way to do great work is to love what you do."
        ];

        function setRandomQuote() {
            const quote = quotes[Math.floor(Math.random() * quotes.length)];
            document.getElementById('quote-text').innerText = `"${quote}"`;
        }
        setRandomQuote(); // Changes on refresh or we can set an interval

        // 3. WEATHER PLACEHOLDER LOGIC
        // We will fill this with your API key later
        function mockWeather() {
            document.getElementById('weather-temp').innerText = "72°F";
            document.getElementById('weather-desc').innerText = "Partly Cloudy";
        }
        mockWeather();

    </script>
</body>
</html>
