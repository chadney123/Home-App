<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Command Center</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505; --card: #151515; --text: #ffffff;
            --accent: #3498db; --success: #2ecc71; --error: #e74c3c;
        }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
        
        /* Grid Dashboard Layout */
        .dashboard {
            display: grid;
            grid-template-columns: 350px 1fr 300px;
            grid-template-rows: 100vh;
            gap: 15px; padding: 15px; box-sizing: border-box;
        }

        /* Sidebar: Time & Profiles */
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .clock-card { background: var(--card); padding: 30px; border-radius: 20px; text-align: center; }
        #time { font-size: 5rem; font-weight: 700; margin: 0; }
        #date { color: #888; font-size: 1.2rem; }

        .profile-section { display: flex; gap: 10px; flex-wrap: wrap; padding: 10px; }
        .avatar { width: 60px; height: 60px; border-radius: 50%; border: 3px solid #333; background: #222; overflow: hidden; cursor: pointer; transition: 0.3s; }
        .avatar.active { border-color: var(--accent); transform: scale(1.1); }

        /* Main Content: Calendar */
        .main-view { background: var(--card); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .event-list { overflow-y: auto; flex-grow: 1; }
        .event-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #333; gap: 15px; }
        .event-color { width: 5px; height: 40px; border-radius: 5px; }

        /* Right Panel: Chores & Weather */
        .right-panel { display: flex; flex-direction: column; gap: 15px; }
        .widget { background: var(--card); padding: 20px; border-radius: 20px; }
        .chore-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #222; }
        .star-btn { cursor: pointer; color: #444; font-size: 1.5rem; }
        .star-btn.done { color: #f1c40f; }

        /* Photo Mode Overlay */
        #photo-mode {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 1000; display: none;
            background-size: cover; background-position: center;
            transition: opacity 1s ease-in-out;
        }
    </style>
</head>
<body>

    <div id="photo-mode" onclick="togglePhotoMode()"></div>

    <div class="dashboard">
        <aside class="sidebar">
            <div class="clock-card" onclick="togglePhotoMode()">
                <h1 id="time">12:00</h1>
                <div id="date">Monday, May 4</div>
            </div>
            
            <div class="widget">
                <h3>Family Profiles</h3>
                <div class="profile-section" id="profiles">
                    <div class="avatar active" style="background-color: #e74c3c;"></div>
                    <div class="avatar" style="background-color: #3498db;"></div>
                    <div class="avatar" style="background-color: #f1c40f;"></div>
                    <div class="avatar" style="background-color: #9b59b6;"></div>
                </div>
            </div>

            <div class="widget">
                <h3>Local Weather</h3>
                <div id="weather-data">Loading...</div>
            </div>
        </aside>

        <main class="main-view">
            <div class="calendar-header">
                <h2>Schedule</h2>
                <button onclick="fetchCalendar()">Sync Now</button>
            </div>
            <div class="event-list" id="event-list">
                <!-- Events will inject here -->
            </div>
        </main>

        <aside class="right-panel">
            <div class="widget">
                <h3>Daily Chores</h3>
                <div id="chore-list">
                    <div class="chore-item"><span>Empty Dishwasher</span> <span class="star-btn" onclick="toggleChore(this)">★</span></div>
                    <div class="chore-item"><span>Walk the Dog</span> <span class="star-btn" onclick="toggleChore(this)">★</span></div>
                    <div class="chore-item"><span>Homework</span> <span class="star-btn" onclick="toggleChore(this)">★</span></div>
                </div>
            </div>
            <div class="widget">
                <h3>Meal Plan</h3>
                <p><strong>Dinner:</strong> Homemade Tacos 🌮</p>
            </div>
        </aside>
    </div>

    <script>
        // --- CONFIGURATION ---
        const GOOGLE_API_KEY = 'YOUR_API_KEY_HERE';
        const CALENDAR_ID = 'primary';
        const WEATHER_API_KEY = 'YOUR_WEATHER_KEY_HERE';

        // --- TIME LOGIC ---
        function updateTime() {
            const now = new Date();
            document.getElementById('time').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: true});
            document.getElementById('date').innerText = now.toLocaleDateString([], {weekday: 'long', month: 'long', day: 'numeric'});
        }
        setInterval(updateTime, 1000);
        updateTime();

        // --- CHORE LOGIC ---
        function toggleChore(el) {
            el.classList.toggle('done');
            // Add sound effect like Cozyla
            const audio = new Audio('https://www.soundjay.com/buttons/sounds/button-3.mp3');
            audio.play();
        }

        // --- PHOTO MODE ---
        let photoIndex = 0;
        const photos = [
            'https://images.unsplash.com/photo-1506744038136-46273834b3fb',
            'https://images.unsplash.com/photo-1470770841072-f978cf4d019e',
            'https://images.unsplash.com/photo-1441974231531-c6227db76b6e'
        ];

        function togglePhotoMode() {
            const el = document.getElementById('photo-mode');
            const isHidden = el.style.display === 'none' || el.style.display === '';
            el.style.display = isHidden ? 'block' : 'none';
            if(isHidden) startSlideshow();
        }

        function startSlideshow() {
            const el = document.getElementById('photo-mode');
            el.style.backgroundImage = `url(${photos[photoIndex]})`;
            photoIndex = (photoIndex + 1) % photos.length;
            setTimeout(() => { if(el.style.display === 'block') startSlideshow(); }, 10000);
        }

        // --- CALENDAR SYNC (MOCK DATA) ---
        function fetchCalendar() {
            const list = document.getElementById('event-list');
            const mockEvents = [
                { title: "Soccer Practice", time: "4:00 PM", color: "#e74c3c" },
                { title: "Date Night", time: "7:30 PM", color: "#9b59b6" },
                { title: "Trash Pickup", time: "All Day", color: "#3498db" }
            ];
            
            list.innerHTML = mockEvents.map(e => `
                <div class="event-item">
                    <div class="event-color" style="background:${e.color}"></div>
                    <div>
                        <div style="font-weight:bold">${e.title}</div>
                        <div style="color:#888; font-size:0.9rem">${e.time}</div>
                    </div>
                </div>
            `).join('');
        }
        fetchCalendar();

        // --- SERVICE WORKER ---
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
