<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>Family Hub Pro V26</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #000; --card: #141414; --text: #fff; --dim: #888; --accent: #3498db;
            --Michelle: #e74c3c; --Paul: #3498db; --Ella: #2ecc71; --Ivy: #f1c40f;
            --Family: #9b59b6; --nav-bg: #050505;
        }
        body.light-mode { --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --dim: #86868b; --nav-bg: #ffffff; }

        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; transition: background 0.5s; }
        
        .tab-content { flex: 1; display: none; overflow: hidden; padding-bottom: 90px; height: 100%; width: 100%; flex-direction: column; }
        .tab-content.active { display: flex; }

        /* HOME GRID */
        .home-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto auto 1fr; gap: 12px; padding: 15px; flex: 1; box-sizing: border-box; }
        .header-tile { grid-column: 1 / span 2; display: flex; justify-content: space-between; align-items: flex-start; }
        .clock-tile h1 { font-size: clamp(4rem, 12vh, 6.5rem); margin: 0; font-weight: 700; letter-spacing: -4px; line-height: 0.85; }
        .date-text { font-size: clamp(0.9rem, 2vh, 1.3rem); margin-top: 5px; color: var(--dim); font-weight: 500; }
        
        .tile { background: var(--card); border-radius: 20px; padding: 10px 15px; border: 1px solid rgba(128,128,128,0.1); display: flex; flex-direction: column; justify-content: center; }
        .tile h3 { margin: 0 0 4px 0; font-size: 0.75rem; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
        
        .weather-container { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
        .weather-main { font-size: clamp(2rem, 5vh, 3rem); font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .weather-forecast { display: flex; gap: 12px; margin-top: 10px; border-top: 1px solid rgba(128,128,128,0.1); padding-top: 8px; }
        .forecast-day { text-align: center; font-size: 0.75rem; color: var(--dim); min-width: 40px; }

        .home-calendar-strip { grid-column: 1 / span 2; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; height: 100%; }
        .person-day { background: var(--card); border-radius: 15px; padding: 12px; border-top: 6px solid var(--c); height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; }
        .person-day h4 { margin: 0 0 2px 0; font-size: 1rem; font-weight: 700; }
        .mini-event { background: var(--c); color: #fff; font-size: 0.95rem; padding: 8px 10px; border-radius: 10px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* CALENDAR TAB */
        .calendar-legend { display: flex; justify-content: center; gap: 15px; padding: 10px; border-bottom: 1px solid rgba(128,128,128,0.1); flex-wrap: wrap; background: var(--card); font-size: 0.9rem; }
        .legend-item { display: flex; align-items: center; gap: 5px; font-weight: 600; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        
        .cal-nav { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: var(--bg); }
        .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 10px; flex: 1; overflow-y: auto; align-content: start; }
        .day-label { text-align: center; font-size: 0.7rem; font-weight: 700; color: var(--dim); padding-bottom: 5px; }
        .day-col { background: var(--card); border-radius: 8px; border: 1px solid rgba(128,128,128,0.1); display: flex; flex-direction: column; min-height: 110px; position: relative; }
        .day-header { text-align: center; padding: 4px; font-size: 0.85rem; border-bottom: 1px solid rgba(128,128,128,0.05); }
        .cal-event { background: var(--c); color: #fff; padding: 3px 5px; border-radius: 4px; font-size: 0.7rem; margin: 2px; font-weight: 600; line-height: 1.1; overflow: hidden; position: relative; }
        .delete-ev { position: absolute; right: 2px; top: 0; font-size: 8px; opacity: 0.5; }

        /* CHORES & LISTS */
        .chore-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 15px; flex: 1; overflow-y: auto; }
        .chore-column { background: rgba(128,128,128,0.05); border-radius: 20px; padding: 15px; border: 1px solid rgba(128,128,128,0.1); display: flex; flex-direction: column; }
        .chore-column h3 { margin: 0 0 15px 0; text-align: center; color: var(--c); font-size: 1.2rem; border-bottom: 2px solid var(--c); padding-bottom: 10px; }
        .chore-item { background: var(--card); padding: 12px; border-radius: 12px; margin-bottom: 10px; font-size: 0.9rem; border-left: 4px solid var(--c); display: flex; flex-direction: column; gap: 5px; }
        .chore-item.done { opacity: 0.6; }
        .list-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .list-container { overflow-y: auto; padding: 0 20px; flex: 1; }
        .list-item { display: flex; align-items: center; justify-content: space-between; padding: 15px; background: var(--card); margin-bottom: 10px; border-radius: 15px; border: 1px solid rgba(128,128,128,0.1); }
        .add-btn { background: var(--accent); color: white; border: none; border-radius: 10px; padding: 8px 15px; font-weight: 700; cursor: pointer; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 80px; background: var(--nav-bg); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(128,128,128,0.1); z-index: 100; }
        .nav-item { color: var(--dim); text-align: center; flex: 1; cursor: pointer; }
        .nav-icon { font-size: 1.8rem; display: block; }
        .nav-label { font-size: 0.65rem; font-weight: 700; }
        .nav-item.active { color: var(--accent); }

        #screensaver { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; background: black; color: white; text-align: center; }
        #ss-clock { font-size: 10rem; font-weight: 700; margin: 0; }
    </style>
</head>
<body onmousemove="resetTimer()" onclick="resetTimer()" ontouchstart="resetTimer()">

    <div id="screensaver" onclick="resetTimer()">
        <h1 id="ss-clock">00:00</h1>
        <div id="ss-date" style="font-size: 2rem; opacity: 0.8;">...</div>
        <div id="ss-weather" style="font-size: 2.5rem; margin: 25px 0;">...</div>
    </div>

    <!-- HOME -->
    <div id="home" class="tab-content active">
        <div class="home-grid">
            <div class="header-tile">
                <div class="clock-tile"><h1 id="clock">00:00</h1><p id="date-string" class="date-text">...</p></div>
                <div class="weather-container">
                    <div class="weather-main"><span id="w-icon">☀️</span> <span id="temp">--°</span></div>
                    <div style="color:var(--accent); font-weight: 700; font-size: 1rem;">Worcester</div>
                    <div id="w-condition" style="color:var(--dim); font-size: 0.8rem;">Checking...</div>
                    <div class="weather-forecast" id="forecast-cont"></div>
                </div>
            </div>
            <div class="tile"><h3>🍲 Dinner</h3><div id="home-dinner" style="font-size: 1.2rem; color: var(--accent); font-weight: 700;">...</div></div>
            <div class="tile">
                <h3>✨ Fun</h3>
                <div id="daily-joke" style="font-size: 0.75rem; color: var(--dim);">...</div>
            </div>
            <div class="tile" style="grid-column: 1 / span 2;"><h3>📝 Latest Note</h3><div id="home-note-preview">...</div></div>
            <div class="home-calendar-strip">
                <div class="person-day" style="--c:var(--Michelle)"><h4>Michelle</h4><div id="day-Michelle"></div></div>
                <div class="person-day" style="--c:var(--Paul)"><h4>Paul</h4><div id="day-Paul"></div></div>
                <div class="person-day" style="--c:var(--Ella)"><h4>Ella</h4><div id="day-Ella"></div></div>
                <div class="person-day" style="--c:var(--Ivy)"><h4>Ivy</h4><div id="day-Ivy"></div></div>
            </div>
        </div>
    </div>

    <!-- CALENDAR -->
    <div id="calendar" class="tab-content">
        <div class="calendar-legend">
            <div class="legend-item"><div class="dot" style="background:var(--Michelle)"></div>Michelle</div>
            <div class="legend-item"><div class="dot" style="background:var(--Paul)"></div>Paul</div>
            <div class="legend-item"><div class="dot" style="background:var(--Ella)"></div>Ella</div>
            <div class="legend-item"><div class="dot" style="background:var(--Ivy)"></div>Ivy</div>
            <div class="legend-item"><div class="dot" style="background:var(--Family)"></div>Hub</div>
        </div>
        <div class="cal-nav">
            <button class="add-btn" onclick="changeMonth(-1)">&larr;</button>
            <h2 id="cal-month-title" style="margin:0; font-size: 1.2rem;">Month</h2>
            <div style="display:flex; gap:10px;">
                <button class="add-btn" style="background:#9b59b6" onclick="addHubEvent()">+ Add Event</button>
                <button class="add-btn" onclick="changeMonth(1)">&rarr;</button>
            </div>
        </div>
        <div id="month-grid-container" class="week-grid"></div>
    </div>

    <!-- CHORES -->
    <div id="tasks" class="tab-content">
        <div class="list-header"><h2>Chores</h2><button class="add-btn" onclick="addTask()">+ New</button></div>
        <div class="chore-grid" id="chore-grid-container"></div>
    </div>

    <div id="meals" class="tab-content"><div class="list-header"><h2>Meals</h2></div><div id="meal-list" class="list-container"></div></div>
    <div id="groceries" class="tab-content"><div class="list-header"><h2>Shopping</h2><button class="add-btn" onclick="addGrocery()">+ Add</button></div><div id="grocery-list" class="list-container"></div></div>
    <div id="notes" class="tab-content"><div class="list-header"><h2>Notes</h2><button class="add-btn" onclick="addNote()">+ Add</button></div><div id="note-list" class="list-container"></div></div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)"><span class="nav-icon">🏠</span><span class="nav-label">HOME</span></div>
        <div class="nav-item" onclick="switchTab('calendar', this)"><span class="nav-icon">📅</span><span class="nav-label">CAL</span></div>
        <div class="nav-item" onclick="switchTab('tasks', this)"><span class="nav-icon">✅</span><span class="nav-label">TASKS</span></div>
        <div class="nav-item" onclick="switchTab('meals', this)"><span class="nav-icon">🍲</span><span class="nav-label">MEAL</span></div>
        <div class="nav-item" onclick="switchTab('groceries', this)"><span class="nav-icon">🛒</span><span class="nav-label">SHOP</span></div>
        <div class="nav-item" onclick="switchTab('notes', this)"><span class="nav-icon">📝</span><span class="nav-label">NOTE</span></div>
    </nav>

    <script>
        const GOOGLE_API_KEY = 'AIzaSyCBb3Uu--Sr21o65TUddUBIPfLfQwZsV_o';
        const FAMILY_CALENDARS = { Michelle: 'malvcomp@gmail.com', Paul: '9f686e18312a637015a36791d26311728da7240728adf8dda932c5cabc13456e@group.calendar.google.com', Ella: '361ba78ae3e35bf7a888ebef5f4cbf436be8049abdfa4680f566e36c1a872e7a@group.calendar.google.com', Ivy: '4993c431444a8a1fe2cc3ff0e4615c2b1b3cc8b53b65b8b5b5c5b4bd06c0aeb7@group.calendar.google.com' };
        
        const firebaseConfig = { apiKey: "AIzaSyCBb3Uu--Sr21o65TUddUBIPfLfQwZsV_o", authDomain: "familyhub-fb842.firebaseapp.com", databaseURL: "https://familyhub-fb842-default-rtdb.firebaseio.com", projectId: "familyhub-fb842", appId: "1:459204148820:web:9808286292bbb322e3b7c1" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let calDate = new Date();

        async function fetchEvents(name, tMin, tMax, limit) {
            try {
                let url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(FAMILY_CALENDARS[name])}/events?key=${GOOGLE_API_KEY}&singleEvents=true&orderBy=startTime&timeMin=${tMin || new Date().toISOString()}`;
                if(tMax) url += `&timeMax=${tMax}`;
                const res = await fetch(url + `&maxResults=${limit || 10}`);
                const data = await res.json();
                return data.items || [];
            } catch(e) { return []; }
        }

        window.addHubEvent = () => {
            const text = prompt("Event description:");
            const date = prompt("Date (YYYY-MM-DD):", new Date().toISOString().split('T')[0]);
            const who = prompt("Whose event? (Michelle, Paul, Ella, Ivy, or Family)", "Family");
            if(text && date) {
                db.ref('hub_events').push({ text, date, who });
                buildMonthCalendar();
            }
        };

        async function buildMonthCalendar() {
            const container = document.getElementById('month-grid-container');
            container.innerHTML = '<div style="grid-column:1/span 7; text-align:center; padding:20px;">Loading...</div>';
            
            const y = calDate.getFullYear(); const m = calDate.getMonth();
            const startOfMonth = new Date(y, m, 1);
            const endOfMonth = new Date(y, m + 1, 0, 23, 59, 59);
            document.getElementById('cal-month-title').innerText = startOfMonth.toLocaleDateString('en-GB',{month:'long', year:'numeric'});

            let allEvs = [];
            // Get Google Events
            for (const name in FAMILY_CALENDARS) {
                const evs = await fetchEvents(name, startOfMonth.toISOString(), endOfMonth.toISOString(), 50);
                evs.forEach(e => {
                    let d = new Date(e.start.dateTime || e.start.date);
                    allEvs.push({ summary: e.summary, person: name, key: d.toDateString() });
                });
            }
            // Get Hub (Firebase) Events
            const hubSnap = await db.ref('hub_events').once('value');
            const hubData = hubSnap.val() || {};
            Object.keys(hubData).forEach(id => {
                const e = hubData[id];
                const d = new Date(e.date);
                if(d >= startOfMonth && d <= endOfMonth) {
                    allEvs.push({ summary: '🏠 ' + e.text, person: e.who || 'Family', key: d.toDateString(), id: id });
                }
            });

            let html = '';
            ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].forEach(d => html += `<div class="day-label">${d}</div>`);
            let firstDay = startOfMonth.getDay(); let blanks = firstDay === 0 ? 6 : firstDay - 1;
            for(let i=0; i<blanks; i++) html += `<div></div>`;
            
            for(let i=1; i<=endOfMonth.getDate(); i++) {
                let currentDay = new Date(y, m, i);
                let isToday = currentDay.toDateString() === new Date().toDateString();
                html += `<div class="day-col" style="${isToday ? 'border: 2px solid var(--accent);' : ''}">
                    <div class="day-header" style="${isToday ? 'background: var(--accent); color: white;' : ''}">${i}</div>
                    <div>`;
                allEvs.filter(e => e.key === currentDay.toDateString()).forEach(e => {
                    html += `<div class="cal-event" style="--c:var(--${e.person})">${e.summary}${e.id ? `<span class="delete-ev" onclick="db.ref('hub_events/${e.id}').remove(); buildMonthCalendar();">✕</span>` : ''}</div>`;
                });
                html += `</div></div>`;
            }
            container.innerHTML = html;
        }

        window.changeMonth = (dir) => { calDate.setMonth(calDate.getMonth() + dir); buildMonthCalendar(); };

        // Reuse standard Hub functions from previous versions
        window.switchTab = (id, el) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active'); el.classList.add('active');
            if(id === 'calendar') buildMonthCalendar();
        };

        db.ref('tasks').on('value', snap => {
            const container = document.getElementById('chore-grid-container'); if(!container) return;
            container.innerHTML = ''; const data = snap.val() || {};
            ['Michelle','Paul','Ella','Ivy'].forEach(name => {
                let colHtml = `<div class="chore-column" style="--c:var(--${name})"><h3>${name}</h3>`;
                let stars = 0;
                Object.keys(data).forEach(id => {
                    if(data[id].assigned === name) {
                        if(data[id].done) stars++;
                        colHtml += `<div class="chore-item ${data[id].done?'done':''}" onclick="db.ref('tasks/${id}').update({done:${!data[id].done}})">${data[id].text}</div>`;
                    }
                });
                container.innerHTML += colHtml + `<div>⭐ ${stars}</div></div>`;
            });
        });

        setInterval(() => {
            const n = new Date();
            document.getElementById('clock').innerText = n.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
            document.getElementById('date-string').innerText = n.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
        }, 1000);

        function resetTimer() { document.getElementById('screensaver').style.display = 'none'; }
        buildMonthCalendar();
    </script>
</body>
</html>
