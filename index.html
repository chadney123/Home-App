<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Hub Pro</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #000; --card: #141414; --text: #fff; --dim: #888; --accent: #3498db;
            --mom: #e74c3c; --dad: #3498db; --kid1: #2ecc71; --kid2: #f1c40f;
            --grad: linear-gradient(135deg, #3498db, #2980b9);
        }

        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Navigation */
        .tab-content { flex-grow: 1; display: none; height: 100%; overflow-y: auto; padding-bottom: 100px; }
        .tab-content.active { display: block; }

        /* --- HOME SCREEN TILES --- */
        .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; box-sizing: border-box; }
        .header-tile { grid-column: 1 / span 2; display: flex; justify-content: space-between; align-items: center; }
        .clock-tile h1 { font-size: 5.5rem; margin: 0; font-weight: 700; letter-spacing: -3px; }
        
        .tile { background: var(--card); border-radius: 24px; padding: 20px; border: 1px solid #222; }
        .tile h3 { margin: 0 0 12px 0; color: var(--dim); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }

        /* --- HOME CALENDAR STRIP (DAY VIEW) --- */
        .home-calendar-strip { grid-column: 1 / span 2; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
        .person-day { background: #0a0a0a; border-radius: 15px; padding: 15px; border-top: 4px solid var(--c); min-height: 80px; }
        .person-day h4 { margin: 0 0 8px 0; font-size: 0.9rem; }

        /* --- BETTER BUTTONS --- */
        .add-btn-round { 
            background: var(--grad); color: white; border: none; border-radius: 50%; 
            width: 45px; height: 45px; font-size: 1.5rem; font-weight: bold; 
            cursor: pointer; box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
            display: flex; align-items: center; justify-content: center;
        }
        .add-btn-round:active { transform: scale(0.9); }

        /* --- SCREENSAVER --- */
        #screensaver {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 9999; display: none;
            justify-content: center; align-items: center; cursor: none;
        }
        #screensaver h1 { font-size: 8rem; opacity: 0.5; font-weight: 300; }

        /* Lists & Notes */
        .list-item { display: flex; align-items: center; padding: 14px; background: #1a1a1a; margin-bottom: 8px; border-radius: 16px; }
        .note-card { background: #1a1a1a; padding: 15px; border-radius: 18px; margin-bottom: 12px; border: 1px solid #333; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 85px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; }
        .nav-item { color: var(--dim); text-align: center; cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 1.6rem; display: block; margin-bottom: 2px; }
    </style>
</head>
<body onmousemove="resetTimer()" onclick="resetTimer()" ontouchstart="resetTimer()">

    <!-- SCREENSAVER -->
    <div id="screensaver" onclick="hideScreensaver()"><h1 id="ss-clock">00:00</h1></div>

    <!-- HOME TAB -->
    <div id="home" class="tab-content active">
        <div class="home-grid">
            <div class="header-tile">
                <div class="clock-tile"><h1 id="clock">00:00</h1><p id="date-string">...</p></div>
                <div style="text-align: right;"><div id="temp" style="font-size: 2.5rem; font-weight: 700;">18°C</div><div style="color:var(--dim)">Evesham, UK</div></div>
            </div>

            <div class="tile">
                <h3>🍲 Dinner</h3>
                <div id="home-dinner" style="font-size: 1.5rem; font-weight: 600;">...</div>
            </div>

            <div class="tile">
                <h3>✅ Tasks</h3>
                <div id="home-tasks-preview" style="font-size: 1.1rem;">No tasks</div>
            </div>

            <div class="tile" style="grid-column: 1 / span 2;">
                <h3>📝 Latest Note</h3>
                <div id="home-note-preview" style="font-size: 1rem; color: #ccc;">No notes yet.</div>
            </div>

            <!-- DAY VIEW FOR EVERYONE -->
            <div class="home-calendar-strip">
                <div class="person-day" style="--c:var(--mom)"><h4>Mom</h4><div id="cal-mom">Free</div></div>
                <div class="person-day" style="--c:var(--dad)"><h4>Dad</h4><div id="cal-dad">Free</div></div>
                <div class="person-day" style="--c:var(--kid1)"><h4>Alex</h4><div id="cal-kid1">Free</div></div>
                <div class="person-day" style="--c:var(--kid2)"><h4>Maya</h4><div id="cal-kid2">Free</div></div>
            </div>
        </div>
    </div>

    <!-- CALENDAR, MEALS, TASKS, NOTES TABS (Simplified for example) -->
    <div id="calendar" class="tab-content"><div style="padding:40px;"><h2>Calendar View</h2><div id="full-calendar"></div></div></div>
    <div id="meals" class="tab-content"><div style="padding:20px;"><h2>Meals</h2><div id="meal-list"></div></div></div>
    
    <div id="tasks" class="tab-content">
        <div style="padding:20px; display:flex; justify-content:space-between; align-items:center;">
            <h2>Daily Tasks</h2>
            <button class="add-btn-round" onclick="addTask()">+</button>
        </div>
        <div id="task-list" style="padding:0 20px;"></div>
    </div>

    <div id="notes" class="tab-content">
        <div style="padding:20px; display:flex; justify-content:space-between; align-items:center;">
            <h2>Family Notes</h2>
            <button class="add-btn-round" onclick="addNote()">+</button>
        </div>
        <div id="note-list" style="padding:0 20px;"></div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)"><span class="nav-icon">🏠</span>Home</div>
        <div class="nav-item" onclick="switchTab('calendar', this)"><span class="nav-icon">📅</span>Calendar</div>
        <div class="nav-item" onclick="switchTab('meals', this)"><span class="nav-icon">🍲</span>Meals</div>
        <div class="nav-item" onclick="switchTab('tasks', this)"><span class="nav-icon">✅</span>Tasks</div>
        <div class="nav-item" onclick="switchTab('notes', this)"><span class="nav-icon">📝</span>Notes</div>
    </nav>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCBb3Uu--Sr21o65TUddUBIPfLfQwZsV_o",
            authDomain: "familyhub-fb842.firebaseapp.com",
            databaseURL: "https://familyhub-fb842-default-rtdb.firebaseio.com",
            projectId: "familyhub-fb842",
            storageBucket: "familyhub-fb842.firebasestorage.app",
            messagingSenderId: "459204148820",
            appId: "1:459204148820:web:9808286292bbb322e3b7c1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. SCREENSAVER LOGIC (2 Minutes)
        let idleTime = 0;
        function resetTimer() { idleTime = 0; hideScreensaver(); }
        setInterval(() => {
            idleTime++;
            if (idleTime >= 120) document.getElementById('screensaver').style.display = 'flex';
        }, 1000);
        function hideScreensaver() { document.getElementById('screensaver').style.display = 'none'; }

        // 2. NOTES LOGIC (FIXED)
        function addNote() {
            const text = prompt("Write your note:");
            if (text) db.ref('notes').push({ text, time: new Date().toLocaleTimeString() });
        }
        db.ref('notes').on('value', (snap) => {
            const list = document.getElementById('note-list');
            const preview = document.getElementById('home-note-preview');
            list.innerHTML = '';
            const data = snap.val();
            let lastNote = "";
            for (let id in data) {
                lastNote = data[id].text;
                const card = document.createElement('div');
                card.className = 'note-card';
                card.innerHTML = `<div>${data[id].text}</div><div style="font-size:0.7rem; color:var(--dim); margin-top:5px;">${data[id].time}</div>`;
                list.prepend(card);
            }
            preview.innerText = lastNote || "No notes yet.";
        });

        // 3. TASKS LOGIC (FIXED HOME SYNC)
        function addTask() {
            const t = prompt("New Task:");
            if(t) db.ref('tasks').push({ text: t, done: false });
        }
        db.ref('tasks').on('value', (snap) => {
            const list = document.getElementById('task-list');
            const homePrev = document.getElementById('home-tasks-preview');
            list.innerHTML = '';
            const data = snap.val();
            let count = 0;
            for(let id in data) {
                if(!data[id].done) count++;
                const row = document.createElement('div');
                row.className = 'list-item';
                row.style.opacity = data[id].done ? '0.3' : '1';
                row.onclick = () => db.ref('tasks/'+id).update({done: !data[id].done});
                row.innerHTML = `<span>${data[id].done ? '✅' : '⭕️'} ${data[id].text}</span>`;
                list.appendChild(row);
            }
            homePrev.innerText = count > 0 ? `${count} items left to do` : "All caught up!";
        });

        // 4. MEAL SYNC
        db.ref('meals').on('value', (snap) => {
            const today = new Date().toLocaleDateString('en-US', { weekday: 'long' });
            const meal = snap.val() ? snap.val()[today] : "No meal set";
            document.getElementById('home-dinner').innerText = meal || "No meal set";
        });

        // 5. CORE UI
        function switchTab(id, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        setInterval(() => {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            document.getElementById('clock').innerText = timeStr;
            document.getElementById('ss-clock').innerText = timeStr;
            document.getElementById('date-string').innerText = now.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});
        }, 1000);
    </script>
</body>
</html>
